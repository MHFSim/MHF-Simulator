<style>
[hidden]{display:none!important}
:root{
 color-scheme:dark;
 --bg:#080d13; --bg2:#0d141c; --surf:#131c27; --surf2:#1a2633; --surf3:#223244; --line:#243448; --line2:#2f4660;
 --tx:#eaf0f7; --tx2:#a3b6c9; --mut:#6f879e;
 --red:#ff3b30; --red2:#c8261c; --amber:#ffb020; --green:#2ee6a6; --cyan:#4cc9f0; --viol:#b388ff; --pink:#e056fd; --gold:#ffd23f;
 --f-head:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow','Segoe UI',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--f-body);font-size:15px;line-height:1.35}
body{background:radial-gradient(1200px 600px at 50% -10%,#14233a 0%,var(--bg) 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
button:disabled{cursor:not-allowed}
h2,h3,h4{margin:0;font-family:var(--f-head);letter-spacing:.02em}
small{font-size:.78em}
p{margin:0}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#2c4058;border-radius:4px}

#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100%,520px);display:flex;flex-direction:column;background:var(--bg2);overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 80px #000a}
@media(min-width:560px){#app{top:12px;bottom:12px;border-radius:26px;box-shadow:0 0 0 1px var(--line2),0 30px 90px #000c}}

/* ---------- Header ---------- */
#top{flex:none;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top,0px)) 12px 8px;background:linear-gradient(#0e1722,#0b121a);border-bottom:1px solid var(--line)}
.clk{display:flex;flex-direction:column;align-items:flex-start;line-height:1;min-width:64px}
.clk #clkDay{font:600 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.clk #clkTime{font:700 22px var(--f-mono);letter-spacing:-.02em;color:var(--tx)}
.clk.after #clkTime{color:var(--amber)}
.clk.after #clkDay::after{content:' · Büroschluss';color:var(--amber)}
#speed{display:flex;gap:3px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:3px}
#speed button{min-width:34px;height:30px;border-radius:7px;text-align:center;font:700 12px var(--f-mono);color:var(--tx2)}
#speed button.on{background:var(--red);color:#fff}
.nerv{position:relative;flex:1;display:grid;grid-template-columns:1fr auto;grid-template-areas:'l v' 'b b';column-gap:8px;row-gap:3px;align-items:end;min-width:0}
.nlabel{grid-area:l;font:700 10px var(--f-body);letter-spacing:.16em;color:var(--mut)}
#nervVal{grid-area:v;font:700 17px var(--f-mono);line-height:1}
.nbar{grid-area:b;height:9px;border-radius:6px;background:#0a1018;border:1px solid var(--line);overflow:hidden}
#nervFill{display:block;height:100%;border-radius:6px;transition:width .5s;background:var(--green)}
#nervFill.mid{background:var(--amber)}#nervFill.lo{background:var(--red)}
.nfloat{position:absolute;right:0;top:-6px;font:700 13px var(--f-mono);animation:fl 2.1s ease-out forwards;pointer-events:none;z-index:20;text-shadow:0 1px 6px #000}
.nfloat.pos{color:var(--green)}.nfloat.neg{color:var(--red)}
@keyframes fl{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.pausetag{flex:none;height:0;overflow:visible;position:relative;z-index:12}
#pauseTag:not(:empty){position:absolute;left:50%;transform:translateX(-50%);top:-26px;background:#ffb020;color:#1a1200;font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:3px 12px;border-radius:8px;white-space:nowrap}

/* ---------- Tabs ---------- */
#tabs{flex:none;display:grid;grid-template-columns:repeat(6,1fr);background:#0b121a;border-top:1px solid var(--line);padding-bottom:max(2px,env(safe-area-inset-bottom,0px))}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--mut);font:600 11px var(--f-body);letter-spacing:0;min-height:54px;text-align:center}
#tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--tx)}
#tabs button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--red)}
.bd{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 10.5px/17px var(--f-mono);text-align:center;padding:0 4px}
#bdFleet{background:var(--amber);color:#1a1200}

/* ---------- Views ---------- */
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 12px 18px}
#v-map{padding:0;display:flex;flex-direction:column;overflow:hidden}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 10px;position:sticky;top:0;background:linear-gradient(var(--bg2) 75%,transparent);z-index:5}
.vhead h2{font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:12px;background:var(--surf3);border:1px solid var(--line2);font:600 14px var(--f-body);text-align:center}
.btn:hover:not(:disabled){background:#2a3f56}
.btn:disabled{opacity:.4}
.btn.go{background:linear-gradient(#26c98f,#19a974);border-color:#2ee6a6;color:#04201a;font-weight:700}
.btn.danger{background:linear-gradient(#e0392f,#b02119);border-color:#ff5a50;color:#fff;font-weight:700}
.btn.big{width:100%;min-height:52px;font-size:16px;margin-top:8px}
.btn.mini,.mini{min-height:34px;padding:5px 10px;font-size:12.5px;border-radius:9px;background:var(--surf3);border:1px solid var(--line2);font-weight:600}
.mini.warn{background:#3a2a0b;border-color:#8a6212;color:#ffd58a}
.mini small{font-family:var(--f-mono);margin-left:4px;color:var(--amber)}
.btn.more{width:100%;margin:10px 0 4px;min-height:38px;font-size:13px;color:var(--tx2)}

/* ---------- Karte ---------- */
#mapWrap{position:relative;flex:0 0 42%;min-height:210px;background:#0c131b;border-bottom:1px solid var(--line);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#map:active{cursor:grabbing}
#world .dname,#world .hname{opacity:0;transition:opacity .2s}
#world.znear .dname,#world.znear .hname{opacity:1}
#world .hname{opacity:.85}
#world.zfar .hname{opacity:0}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:11px;background:#101a25ee;border:1px solid var(--line2);text-align:center;font:600 20px var(--f-body);line-height:36px;backdrop-filter:blur(6px)}
.maplegend{position:absolute;left:10px;bottom:8px;display:flex;gap:10px;flex-wrap:wrap;font:600 10.5px var(--f-body);color:var(--tx2);background:#0b121acc;padding:4px 9px;border-radius:9px;backdrop-filter:blur(6px)}
.maplegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.mk-inc{cursor:pointer}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.mk-veh .vb{fill:#2b3d52;stroke:#8fb0d0;stroke-width:1.6}
.mk-veh.st-toScene .vb{fill:#d6291e;stroke:#ffb3ac}
.mk-veh.st-toHosp .vb{fill:#0c7da0;stroke:#a6e8ff}
.mk-veh.st-scene .vb{fill:#b57906;stroke:#ffe29a}
.mk-veh.st-cool .vb,.mk-veh.st-return .vb{fill:#1c2a39;stroke:#587393}
.mk-veh.st-toScene .vb,.mk-veh.st-toHosp .vb{animation:sirene 0.9s steps(2) infinite}
@keyframes sirene{50%{filter:brightness(1.5)}}
.mk-veh.fisu .vb{stroke:var(--gold)}
.mk-veh .vl{opacity:0}
#world.znear ~ #markers .vl{opacity:1}
#incPanel{flex:1;min-height:0;display:flex;flex-direction:column}
.panelhead{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px 6px;font:700 13px var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--tx2)}
.panelhead span{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font:700 11px/20px var(--f-mono);text-align:center;padding:0 5px}
.panelhead span:empty{display:none}
#incList{flex:1;overflow-y:auto;padding:0 12px 14px;display:flex;flex-direction:column;gap:8px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:28px 20px;color:var(--mut)}
.empty .emoji{font-size:34px;opacity:.7}.empty b{color:var(--tx2);font:700 16px var(--f-head);letter-spacing:.05em;text-transform:uppercase}
.inc{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:11px 12px 14px;background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--lc);border-radius:14px;overflow:hidden;width:100%}
.inc:active{background:var(--surf2)}
.icode{display:flex;flex-direction:column;align-items:center;min-width:62px}
.icode b{font:700 20px var(--f-mono);color:var(--lc);letter-spacing:-.03em}
.icode small{font:700 10px var(--f-body);letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.imid{display:flex;flex-direction:column;min-width:0}
.iaddr{font:600 16px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idist{font-size:12px;color:var(--mut)}
.istate{margin-top:3px;font:600 12.5px var(--f-body);color:var(--tx2)}
.inc.warn .istate{color:var(--amber)}.inc.q .istate{color:var(--cyan)}.inc.tx .istate{color:var(--green)}
.inc.q{box-shadow:0 0 0 1px #4cc9f044,0 0 18px #4cc9f022}
.ibar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#0a1118}
.ibar i{display:block;height:100%;background:var(--lc);opacity:.85;transition:width .4s linear}

/* ---------- Chips / Balken ---------- */
.chip{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 7px;border-radius:6px;font:700 10.5px var(--f-mono);letter-spacing:.03em;background:#223244;color:var(--tx2);vertical-align:middle}
.chip.c-NFS{background:#0f3a30;color:var(--green)}.chip.c-NKV{background:#0d3347;color:var(--cyan)}.chip.c-NKI{background:#2c2250;color:var(--viol)}
.chip.c-NKA{background:#472027;color:#ff9aa8}.chip.c-IK{background:#443411;color:var(--gold)}.chip.c-NA{background:#3a1a1a;color:#ff8a80}.chip.c-RS{background:#252f3a;color:var(--tx2)}

.rmeta{display:flex;gap:14px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}.delta{flex:none;text-align:center;min-width:84px;padding:6px 10px;background:var(--bg2);border-radius:12px}.delta b{display:block;font:700 28px var(--f-mono)}.delta span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}.delta.pos b{color:var(--green)}.delta.neg b{color:#ff6b61}.rcrew{font-size:13px;color:var(--tx2)}
.mcard.hio{max-height:94%}.chat{display:flex;flex-direction:column;gap:8px}.bubble{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.45}.bubble small{display:block;font:700 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:2px}.bubble.npc{background:var(--surf3);border-bottom-left-radius:4px;align-self:flex-start}.bubble.me{background:#164c6b;border-bottom-right-radius:4px;align-self:flex-end}.bubble.sys{align-self:center;background:none;color:var(--amber);font-size:13px;text-align:center;font-style:italic;max-width:100%}
.hioopts{flex:none;padding:10px 14px 14px;border-top:1px solid var(--line);max-height:50%;overflow-y:auto}
.mcard.end{text-align:center;padding:26px 20px 18px;align-items:center}.mcard.end h2{font-size:34px;text-transform:uppercase;letter-spacing:.04em;margin:6px 0}.endhero{font-size:60px;animation:pop 1s infinite}.mcard.end p{color:var(--tx2);margin-bottom:12px}.mcard.end.win{background:linear-gradient(#173f33,var(--surf));border-color:var(--green)}.mcard.end.lose{background:linear-gradient(#4a1318,var(--surf));border-color:var(--red)}
.shot{padding:12px 14px;margin:6px 0 14px;border:2px dashed var(--gold);border-radius:12px;color:var(--gold);font:700 16px var(--f-head);letter-spacing:.04em}
.mcard.end .stats{width:100%}.mcard.end .mfoot{width:100%;border:0}

/* ---------- Toasts ---------- */
#toasts{position:absolute;left:10px;right:10px;top:max(64px,calc(env(safe-area-inset-top,0px) + 58px));z-index:80;display:flex;flex-direction:column;gap:5px;pointer-events:none}
#app.modalopen .toast:not(.alarm),#app.sheetopen .toast.info{display:none}
.toast{pointer-events:none;padding:8px 12px;border-radius:12px;background:#101a25f2;border:1px solid var(--line2);font-size:13.5px;box-shadow:0 8px 24px #0009;animation:tin .25s;backdrop-filter:blur(8px)}
.toast[data-a]{pointer-events:auto;cursor:pointer}.toast.alarm{border-color:var(--red);background:#2a1114f2}.toast.alarm::before{content:'ALARM ';font:700 11px var(--f-body);letter-spacing:.16em;color:#ff6b61}
.toast.warn{border-color:#8a6212;background:#2a210cf2}.toast.bad{border-color:var(--red)}.toast.out{opacity:0;transform:translateY(-8px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

/* ---------- Intro ---------- */
#intro{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 22px;text-align:center;background:radial-gradient(600px 420px at 50% 20%,#2b0f13 0%,#0a1018 70%)}
#intro .light{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a70,#d6291e 60%,#6b100b);box-shadow:0 0 0 8px #ff3b3022,0 0 60px #ff3b3088;animation:blink 1.2s infinite;display:grid;place-items:center}

.tag2{font:600 13px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--tx2)}
#login{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px 22px;text-align:center;background:radial-gradient(600px 420px at 50% 20%,#2b0f13 0%,#0a1018 70%)}
#login .light{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a70,#d6291e 60%,#6b100b);box-shadow:0 0 0 8px #ff3b3022,0 0 60px #ff3b3088;animation:blink 1.2s infinite;display:grid;place-items:center}
#login .light svg{width:40px;height:40px;fill:#fff}
#login h1{margin:0;font:700 clamp(40px,12vw,58px)/0.95 var(--f-head);text-transform:uppercase;letter-spacing:.03em}

#loginForm{display:flex;flex-direction:column;gap:10px;width:min(300px,100%)}
#loginPw{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #33404f;background:#0e1620;color:#fff;font:600 17px var(--f-body,inherit);text-align:center;outline:none}
#loginPw:focus{border-color:var(--red)}

@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.alpha{max-width:340px;padding:10px 14px;border:1px solid #6b5518;background:#2a2210;border-radius:12px;color:#ffd58a;font-size:13.5px}
#introDiff{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:4px;width:min(340px,100%)}
#introDiff button{min-height:44px;border-radius:10px;text-align:center;font-weight:700;color:var(--tx2)}#introDiff button.on{background:var(--red);color:#fff}
.introbtns{display:flex;flex-direction:column;gap:9px;width:min(340px,100%)}.introbtns .btn{width:100%;margin:0}

/* ---------- Statusleiste, Maut, Rausch ---------- */
.nbar{position:relative}

/* Shop */

.gr.bad{color:var(--red);font-size:11px!important}.gr.safe{color:var(--cyan);font-size:11px!important}
.statusbox{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}

.buff{display:flex;align-items:center;gap:10px;margin:6px 0}

.bm{flex:1;min-width:0}

.bbar{height:8px;border-radius:5px;background:#0a1018;border:1px solid var(--line);overflow:hidden;margin-top:3px}

/* Notarzt + Spezialmenü */

/* Besatzung: Rausch- und Sättigungs-Balken */

.islot .im{color:var(--mut);font-size:12.5px}.islot .im:nth-of-type(2){grid-area:m1}.islot .im:nth-of-type(3){grid-area:m2}

/* ===== HULK ===== */
.av.hulk{background:radial-gradient(circle at 40% 30%,#6dff3a,#2c8a14 70%);border-color:#d6ff9a;box-shadow:0 0 0 2px #0a2a06,0 0 14px #5bff2a;animation:hshake .5s infinite}

.hulkico .brow{stroke:#0a2a06;stroke-width:2;fill:none}.hulkico .eye{fill:#ff2a1a}.hulkico .teeth{stroke:#fff;stroke-width:1.1;fill:none}
@keyframes hshake{0%,100%{transform:translate(0,0)}25%{transform:translate(1px,-1px) rotate(-3deg)}75%{transform:translate(-1px,1px) rotate(3deg)}}
.hulktag{display:inline-block;padding:2px 9px;border-radius:6px;background:linear-gradient(#58ff2a,#1f9a0b);color:#052004;font:900 13px var(--f-head);letter-spacing:.18em;text-transform:uppercase;transform:skew(-8deg);box-shadow:0 0 10px #4dff2a99}

.crow.hulk::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 18%,#ff2a1a55 19%,transparent 21%),linear-gradient(112deg,transparent 41%,#ff2a1a44 42%,transparent 44%),linear-gradient(118deg,transparent 63%,#ff2a1a55 64%,transparent 66%);mix-blend-mode:screen}
.crow.hulk .ctop b,.crow.hulk .nametap{text-transform:uppercase;letter-spacing:.08em;color:#c9ff9a;text-shadow:0 0 10px #4dff2a,2px 2px 0 #000;font-size:22px}
.crow.hulk .cmain{position:relative}.crow.hulk .cbot,.crow.hulk .cnote{color:#9fd88a}
.vc.hulkv{border:2px solid #5bff2a;background:linear-gradient(135deg,#0d2a08,#173f0d 60%,#220d0d);box-shadow:0 0 16px #3cff2a44,inset 0 0 18px #000;position:relative;overflow:hidden}
.vc.hulkv::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 22%,#ff2a1a44 23%,transparent 25%),linear-gradient(112deg,transparent 70%,#ff2a1a44 71%,transparent 73%)}
.vc.hulkv .vname{color:#9dff6a;text-shadow:0 0 10px #4dff2a,2px 2px 0 #000;letter-spacing:.08em}
.vc.hulkv .slot{background:#0c2208;border-color:#2f7a1c}
.vc.hulkv .slot .sn b{color:#d3ffb0;text-transform:uppercase;letter-spacing:.06em}
#map .mk-veh.hulk .vb{fill:#2fb515;stroke:#c8ff7a;stroke-width:3.4;filter:drop-shadow(0 0 5px #5bff2a)}
#map .mk-veh.hulk .vt{fill:#052004}
#map .mk-veh.hulk{animation:hshake .6s infinite}
.hmenu{margin:0 0 8px;padding:10px;border-radius:14px;border:2px solid #5bff2a;background:linear-gradient(#0f2e09,#0a1a06);display:flex;flex-direction:column;gap:8px;box-shadow:0 0 16px #3cff2a44}
.spbadge.hb{background:#58ff2a;color:#052004}
.btn.hsmash{display:flex;align-items:center;gap:10px;text-align:left;background:linear-gradient(#2a8a12,#145a08);border:2px solid #9dff6a;color:#eaffd0}
.hsmash .hic{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#6dff3a,#2c8a14);display:grid;place-items:center;flex:none}
.hsmash .hic svg{width:90%;height:90%;fill:#1f6a0e;stroke:none}.hsmash .wtx b{display:block;font-size:15px}.hsmash .wtx small{display:block;font-size:11.5px;opacity:.85}
/* Mutation-Labor */

.mact{display:flex;justify-content:flex-end}
.btn.mutbtn{background:linear-gradient(#58ff2a,#1f9a0b);border:2px solid #d6ff9a;color:#052004;font:900 16px var(--f-head);letter-spacing:.14em;padding:10px 18px;box-shadow:0 0 14px #4dff2a99}
.mcard.hulkm{border:2px solid #5bff2a;background:linear-gradient(#0f2e09,#0a1a06);box-shadow:0 0 30px #3cff2a66}
.mcard.hulkm .mhead b{color:#b8ff7a}
.mutban>b{display:block}
.mutban p b{display:inline;font:800 inherit var(--f-body);letter-spacing:.04em;color:#b8ff7a;text-shadow:0 0 8px #4dff2a}
.mutban p b{font-size:inherit}
.nlabel{white-space:nowrap}
.nerv.psy .nlabel{letter-spacing:.08em}
.nlabel em{margin-left:4px;padding:1px 5px;font-size:8.5px;letter-spacing:.06em}
.testlogin{display:flex;gap:8px;margin:6px 0}.testlogin input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--tx);font:600 15px var(--f-body)}
.nametap.hari{background:#10232f;border-color:#2f7a9a;color:#9fdcff}
.hq{margin:4px 0 12px;padding:14px;border-radius:14px;background:#10232f;border:1px solid #2f7a9a;font:600 19px/1.35 var(--f-body);color:#e6f6ff}
.hq cite{display:block;margin-top:8px;font-style:normal;font-size:13px;color:#8cc4e0}
.hari .btn.big small{opacity:.75;margin-left:6px}
.hari .btn.go,.hari .btn.go:disabled{background:linear-gradient(#26c98f,#19a974);border-color:#2ee6a6;color:#04201a;font-weight:700}.hari .btn.go:disabled{opacity:.45}

/* Blut auf dem ganzen Bildschirm (Mutation) */
#blood{position:absolute;inset:0;z-index:45;pointer-events:none;overflow:hidden;box-shadow:inset 0 0 90px #7a000088,inset 0 0 220px #3a000066}
.bloodtop{position:absolute;left:0;right:0;top:0;height:34px;background:radial-gradient(circle at 6% 0,#a00 0 14px,transparent 15px),radial-gradient(circle at 17% 0,#8a0b0b 0 20px,transparent 21px),radial-gradient(circle at 29% 0,#b00 0 12px,transparent 13px),radial-gradient(circle at 41% 0,#900 0 22px,transparent 23px),radial-gradient(circle at 53% 0,#a00 0 15px,transparent 16px),radial-gradient(circle at 64% 0,#8a0b0b 0 19px,transparent 20px),radial-gradient(circle at 76% 0,#b00 0 13px,transparent 14px),radial-gradient(circle at 88% 0,#900 0 21px,transparent 22px),radial-gradient(circle at 97% 0,#a00 0 14px,transparent 15px),linear-gradient(#7a0000,#7a0000) top/100% 8px no-repeat;filter:drop-shadow(0 3px 4px #000a)}
.drip{position:absolute;top:0;height:0;border-radius:0 0 40% 40%;background:linear-gradient(90deg,#6d0000,#c4101a 45%,#7d0008);box-shadow:0 0 6px #5a000099;animation:bleed 8s cubic-bezier(.45,0,.55,1) infinite}
.drip::after{content:'';position:absolute;left:50%;bottom:-5px;width:230%;aspect-ratio:1;transform:translateX(-50%);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 35% 30%,#ff4a4a,#b0000f 55%,#650000)}
@keyframes bleed{0%{top:0;height:0;opacity:1}55%{top:0;height:var(--len);opacity:1}92%{top:105%;height:var(--len);opacity:1}100%{top:110%;height:var(--len);opacity:0}}
.mutglow{animation:none!important;box-shadow:none!important;opacity:1!important}

/* Mutanten im Entsende-Menü */
.dv.hulkd{position:relative;overflow:hidden;border:2px solid #5bff2a;box-shadow:0 0 14px #3cff2a44,inset 0 0 16px #000;background:linear-gradient(135deg,#0d2a08,#173f0d 60%,#220d0d)}
.dv.hulkd::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#ff2a1a44 31%,transparent 33%),linear-gradient(112deg,transparent 72%,#ff2a1a44 73%,transparent 75%)}
.dv.hulkd>*{position:relative}
.dv.hulkd .dvl b{color:#9dff6a;text-shadow:0 0 10px #4dff2a,2px 2px 0 #000;letter-spacing:.08em}
.dv.hulkd .dcrew{color:#d3ffb0;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.dhulk{display:inline-flex;align-items:center;gap:5px;color:#b8ff7a;text-shadow:0 0 8px #4dff2a}
.dhulk .av{width:22px;height:22px;border-width:1.5px;box-shadow:0 0 8px #5bff2a}
.dv.hulkd .btn.go{background:linear-gradient(#58ff2a,#1f9a0b);border:2px solid #d6ff9a;color:#052004;font-weight:900;letter-spacing:.06em;box-shadow:0 0 12px #4dff2a88}

/* ===== Hulk-Modus (Nervenbalken) ===== */
#nervFill.hulkm{background:linear-gradient(90deg,#39d11f,#9dff2a,#d4ff3a);box-shadow:0 0 12px #6dff2acc}
.nerv.hulkmode .nbar{border-color:#4aa51f;animation:nvib .12s linear infinite}
.nerv.hulkmode #nervVal{color:#9dff2a;text-shadow:0 0 8px #4dff2a}
@keyframes nvib{0%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1.5px)}100%{transform:translate(0,0)}}
.nerv.hulkmode .nlabel{white-space:normal;line-height:1.05}
.nerv.hulkmode .nlabel em{display:inline-block;margin-left:4px;background:linear-gradient(#58ff2a,#1f9a0b);color:#052004;font-size:7.5px;letter-spacing:.04em;line-height:1.15;font-weight:800;text-transform:uppercase;white-space:normal;max-width:110px;vertical-align:middle}
#tabs.t8{grid-template-columns:repeat(8,1fr)}#tabs.t8 button{font-size:9px}#tabs.t8 button svg{width:20px;height:20px}
#tabNuke{color:#ff5a4a}#tabNuke.on::before{background:#ff3b30}
/* ===== Atombombe ===== */
#v-nuke .vhead h2{color:#ff4a3a;text-shadow:0 0 12px #ff2a1a}
.nukeban{padding:18px;margin-bottom:14px;border-radius:16px;border:2px solid #ff3b30;background:repeating-linear-gradient(45deg,#2a0b09 0 14px,#1a0605 14px 28px);text-align:center}
.nukesym{font-size:58px;line-height:1;filter:drop-shadow(0 0 14px #ff3b30)}
.nukeban b{display:block;font:900 30px var(--f-head);letter-spacing:.2em;color:#ff6a5a;text-shadow:0 0 12px #ff2a1a}
.nukeban p{margin-top:8px;font-size:14px;color:#ffc4bd}
.btn.nukego{width:100%;background:linear-gradient(#ff4a3a,#a31208);border:2px solid #ffb0a6;color:#fff;font:900 18px var(--f-head);letter-spacing:.14em;padding:16px}
.nukearmed{text-align:center}.nukearmed p{color:#ffc4bd;margin-bottom:16px}
.nukered{position:relative;width:min(240px,70vw);aspect-ratio:1;border-radius:50%;margin:6px auto;display:grid;place-items:center;align-content:center;gap:4px;background:radial-gradient(circle at 38% 30%,#ff8a7a,#e01a0a 45%,#7a0500);border:8px solid #2a2a2a;box-shadow:0 0 0 4px #ffcc00,0 0 40px #ff2a1a;animation:redblink .55s steps(2) infinite}
.nukered span{font-size:84px;line-height:1;color:#fff;filter:drop-shadow(0 2px 4px #000)}
.nukered em{font:900 14px var(--f-head);font-style:normal;letter-spacing:.2em;color:#fff}
@keyframes redblink{0%{filter:brightness(1.35);box-shadow:0 0 0 4px #ffcc00,0 0 70px #ff2a1a}50%{filter:brightness(.55);box-shadow:0 0 0 4px #7a6200,0 0 8px #7a0500}}
.mcard.nukem{border:2px solid #ff3b30;background:linear-gradient(#2a0b09,#140504);box-shadow:0 0 30px #ff2a1a66}
.mcard.nukem .mhead b{color:#ff8a7a}.mcard.nukem small{opacity:.7}
.mcard.nukeend{border-color:#ff3b30;background:linear-gradient(#3a0d08,#140504)}
/* Explosion */
#nukefx{position:absolute;inset:0;z-index:300;pointer-events:none;overflow:hidden}
#nukefx>*{position:absolute;opacity:0}
.nflash{inset:0;background:#fff}
.nfire{left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe27a 25%,#ff7a1a 55%,#b01000 80%,transparent 100%)}
.nring{left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:6px solid #ffb05a;box-shadow:0 0 24px #ff6a1a}
.nmush{left:50%;bottom:8%;width:0;height:0}
.nmush .stem{position:absolute;left:-26px;bottom:0;width:52px;height:0;border-radius:26px 26px 0 0;background:linear-gradient(90deg,#4a1a08,#c4521a,#4a1a08)}
.nmush .cap,.nmush .cap2{position:absolute;left:0;bottom:0;border-radius:50%;transform:translateX(-50%) scale(0)}
.nmush .cap{width:220px;height:130px;background:radial-gradient(circle at 50% 40%,#ffd27a,#ff6a1a 55%,#5a1405)}
.nmush .cap2{width:150px;height:90px;background:radial-gradient(circle at 50% 40%,#fff2b0,#ff8a2a 60%,#7a2008)}
.ntext{left:0;right:0;top:12%;text-align:center;font:900 44px var(--f-head);letter-spacing:.14em;color:#fff;text-shadow:0 0 18px #ff2a1a,0 4px 0 #000}
#nukefx.go .nflash{animation:nflash 7s ease-out forwards}
#nukefx.go .nfire{animation:nfire 4.2s ease-out .15s forwards}
#nukefx.go .r1{animation:nring 3.2s ease-out .2s forwards}#nukefx.go .r2{animation:nring 3.2s ease-out .7s forwards}#nukefx.go .r3{animation:nring 3.2s ease-out 1.3s forwards}
#nukefx.go .nmush .stem{animation:nstem 4s ease-out .9s forwards;opacity:1}

.fuelrow.mid .fbar i,.gauge.mid .gbar i{background:var(--amber)}.fuelrow.lo .fbar i,.gauge.lo .gbar i{background:var(--red)}
.fuelrow.lo b,.fuelrow.lo .fic{color:var(--red)}
.gauge{padding:10px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-bottom:10px}
.gtop{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}.gtop b{font:800 28px var(--f-head)}
.gbar{position:relative;height:16px;border-radius:99px;background:var(--surf3);overflow:hidden;margin:6px 0 3px;border:1px solid var(--line)}
.gbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.gbar u{position:absolute;top:0;bottom:0;width:2px;background:#ffffffaa}
.gscale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)}
.gauge.lo .gtop b{color:var(--red)}
.fl-warn{color:var(--amber);font-weight:700;margin:0 0 8px}
.vmrows{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.vmrows div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.vmrows span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.vmrows b{font-size:13.5px}
.fl-live{padding:7px 10px;border-radius:10px;background:rgba(255,176,32,.14);border:1px solid rgba(255,176,32,.5);color:var(--amber);font-weight:700;margin-bottom:8px}
.vmtype{color:var(--tx2);margin-left:8px}
.mk-veh.st-toFuel .vb,.mk-veh.st-fuel .vb{fill:#6b4a06;stroke:#ffd27a}
.chiprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.chiptag{padding:3px 9px;border-radius:99px;background:rgba(80,160,255,.16);border:1px solid rgba(80,160,255,.55);font-weight:700;font-size:12.5px}
.chipbox{background:rgba(80,160,255,.12)!important;border-color:rgba(80,160,255,.5)!important;color:var(--tx)!important}
.chiplist{display:flex;flex-direction:column;gap:8px}
.chipcard{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:linear-gradient(135deg,rgba(80,160,255,.16),rgba(80,160,255,.04));border:1px solid rgba(80,160,255,.5)}
.chipic{font-size:26px}.chipinfo{flex:1;display:flex;flex-direction:column}.chipinfo b{font:800 20px var(--f-head)}.chipinfo small{color:var(--mut)}
.chipst{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--line)}
.chipempty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 12px;border-radius:14px;border:1px dashed var(--line);background:var(--bg2);text-align:center}
.chipempty span{font-size:30px}.chipempty small{color:var(--mut)}
.tchip{--s:22px;display:inline-flex;align-items:center;justify-content:center;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6a5e,#d11f1f 70%);border:2px solid #ffb4ac;box-shadow:inset 0 0 0 2px #b01818,0 1px 3px #0006;color:#fff;font:800 calc(var(--s)*.3)/1 Barlow Condensed,sans-serif;font-style:normal;letter-spacing:.02em;vertical-align:middle;margin-right:6px;box-sizing:border-box;text-indent:0}
.tchip.big{--s:42px;margin:0}
.chiptag .tchip{--s:20px}

.fuelinc{grid-template-columns:auto 1fr auto!important;cursor:pointer}
.dfbtn{align-self:center;padding:8px 10px;border-radius:10px;border:1px solid var(--red);background:rgba(255,80,70,.14);color:var(--red);font-weight:800;font-size:12.5px}
.dfrev .mbody{display:flex;flex-direction:column;gap:10px}
.radiow{display:inline-block;animation:rwv 1s ease-in-out infinite}
@keyframes rwv{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.15)}}
.fbub{padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);opacity:0;transform:translateY(8px);animation:fbin .4s ease forwards}
.fbub small{display:block;color:var(--mut);font-size:11px;margin-bottom:3px;letter-spacing:.04em;text-transform:uppercase}
.fbub p{margin:0;font-weight:600}
.fbub.crew{border-color:rgba(255,100,90,.6);background:rgba(255,80,70,.1);animation-delay:.3s}
.fbub.crew .t1{animation:shk .5s ease .8s 3}
.fbub.crew .dots{display:inline-block;color:var(--red);letter-spacing:3px;animation:dt 1s steps(3) 3}
.fbub.me{border-color:rgba(80,160,255,.5);background:rgba(80,160,255,.1);animation-delay:2.4s;margin-left:24px}
.dfgo{animation:fbp .4s ease 3.6s both}
@keyframes fbin{to{opacity:1;transform:none}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes dt{0%{opacity:.2}100%{opacity:1}}
@keyframes fbp{from{opacity:0;pointer-events:none}to{opacity:1;pointer-events:auto}}
.fuelinc .istate{color:#4da3ff}.fuelinc .ibar i{background:#4da3ff}.fuelinc .icode b{color:#4da3ff}

/* PCI-Zentrum nach Tag/Uhrzeit (ED-P20 / Aviso PCI Zentren). day: 0=Mo..6=So */
function pciRule(day,hour){
 if(hour<8){ const pd=(day+6)%7; if(pd>=5) return {mode:'fix',h:'AKH',txt:'Wochenende: ganztags AKH'}; return pciFix(pd); }
 if(day>=5) return {mode:'fix',h:'AKH',txt:'Sa/So ganztags: AKH'};
 if(hour<13) return {mode:'near',txt:'Mo–Fr 08:00–13:00: nächstgelegenes PCI-Zentrum (Backup KFL)'};
 return pciFix(day);
}

 const m=['KLA','KDO','KFL','KOR','HAN'][d];

function penCase(d){
 Q({id:d.id,g:d.g||'r',age:d.age,w:1.5,tod:d.tod,make:P=>({

  steps:[
   ST('Wie beurteilst du zuerst?',[

    o('Sofort Schmerzmittel geben, die Fragen können später gestellt werden',0,'NFS','Vorher Allergien, Vorerkrankungen und Vormedikation klären.',{crit:1}),
    o('Den Patienten zum Gehen auffordern, um die Belastbarkeit zu testen',0,'NFS','Das kann die Verletzung verschlimmern.',{crit:1}),

    o('Erst den Papierkram der Versicherung erledigen',0,'NFS','Nicht Aufgabe im Einsatz.')
   ],'ED-P29'),
   ST(d.q2,[
    o(d.s2,1,'NFS',d.f2,{best:1}),
    o(d.w2a,0,'NFS',d.f2a,{crit:1}),
    o(d.w2b,0,'NFS',d.f2b),
    o('Gar nichts tun und abwarten',0,'NFS','Die Versorgung der Verletzung hat Priorität.'),
    o('Nur die Schmerzen behandeln und die Verletzung ignorieren',0,'NFS','Erst die Verletzung versorgen.')
   ],d.sop||'ED-P30'),
   ST(`Der Schmerz liegt bei NRS ${d.nrs}. ${d.contra} Welche Analgesie?`,[
    o('Methoxyfluran (Penthrop) 3 ml inhalativ, Patient inhaliert selbst',1,'NFS','Richtig: Hier ist Methoxyfluran die einzige passende Analgesie. '+d.why,{med:'penthrop',best:1,res:'Nach wenigen Atemzügen lässt der Schmerz deutlich nach.'}),
    o('Ibuprofen 600 mg p.o.',0,'NFS','Nicht im Algorithmus.',{med:1}),

 })});
}

function startTrip(v,to,extra){
 const pts=[{x:v.x,y:v.y}];
 if(Math.abs(v.x-to.x)>1&&Math.abs(v.y-to.y)>1){
  const hf=(Math.floor(v.x*7+v.y*3+to.x)%2)===0;
  pts.push(hf?{x:to.x,y:v.y}:{x:v.x,y:to.y});
 }
 pts.push({x:to.x,y:to.y});
 let len=0; for(let i=1;i<pts.length;i++) len+=Math.abs(pts[i].x-pts[i-1].x)+Math.abs(pts[i].y-pts[i-1].y);
 const ex=extra||0;
 const gz=HMAP.GRZ, far=to.far||((Math.abs(v.x-gz.x)<2&&Math.abs(v.y-gz.y)<2)?gz.far:0);
 v.trip={pts,len,ex,dur:(far||Math.max(1.5,len/VSPEED))*(typeof raserFactor==='function'?raserFactor(v):1)+ex,el:0,to:{x:to.x,y:to.y}};

}
function tripPos(T,f){
 let d=f*T.len;
 for(let i=1;i<T.pts.length;i++){
  const a=T.pts[i-1],b=T.pts[i]; const sl=Math.abs(b.x-a.x)+Math.abs(b.y-a.y);
  if(d<=sl||i===T.pts.length-1){ const k=sl>0?clamp(d/sl,0,1):1; return {x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k}; }
  d-=sl;
 }

}

 const f=T.dur-T.ex>0?clamp((T.el-T.ex)/(T.dur-T.ex),0,1):1;
 const p=tripPos(T,f); v.x=p.x; v.y=p.y;
 return T.el>=T.dur;
}

function pickDistrict(q){
 if(QDIST[q.id]) return DISTRICTS.find(d=>d.n===pick(QDIST[q.id]));
 let tot=0; DISTRICTS.forEach(d=>tot+=DIST_W[d.n]); let r=Math.random()*tot;
 for(const d of DISTRICTS){ r-=DIST_W[d.n]; if(r<=0) return d; }
 return DISTRICTS[0];
}
function spawnIncident(forceId){
 const q=forceId?QUESTS.find(x=>x.id===forceId):pickQuest();
 const g=q.g==='f'?'f':(q.g==='m'?'m':(Math.random()<.5?'m':'f'));
 const age=rnd(q.age[0],q.age[1]);
 const P=makeP(g,age);
 const d=q.make(P);
 if(d.patient) dedupeName(q,d,g);
 const dist=pickDistrict(q);
 const street=QSTREET[q.id]||pick(dist.streets);
 const fullAddr=uniqueAddr(street);
 const x=clamp(dist.x+rnd(-16,16),30,970), y=clamp(dist.y+rnd(-14,14),30,770);
 const inc={id:G.nid++,qid:q.id,d,st:'alarm',born:G.t,
  addr:fullAddr,plz:'1'+String(dist.n).padStart(2,'0')+'0',dist:dist.n,distName:dist.name,x,y,
  code:d.code,label:d.label,lvl:d.code[2]||'C',step:0,vehs:[],log:[],err:0,crit:0,meds:[],pen:false,sets:{},best:0,
  cur:null,tx:null,age,g,sceneT:null,seen:false,okSteps:0,comp:0,ev:0};
 G.inc.push(inc); G.spawned++;
 G.lastQ.push(q.id); if(G.lastQ.length>3) G.lastQ.shift();
 logEv('einsatz',`Alarm #${inc.id}: ${inc.code} – ${inc.label}, ${inc.addr}, ${inc.plz} Wien (${inc.age} J., ${inc.g==='f'?'w':'m'})`);
 toast(`<b>${inc.code}</b> · ${inc.addr}, ${inc.plz} Wien`,'alarm',inc.id);
 playAlarm();
 return inc;
}

/* ---------- Dispatch ---------- */
function dispatch(vid,iid){
 const v=vehById(vid), inc=incById(iid);
 if(!v||!inc) return false;
 const why=canDispatch(v); if(why) { toast(`${v.id}: ${why}`,'warn'); return false; }
 if(!['alarm','enroute','scene','needrtw'].includes(inc.st)) return false;
 if(inc.st==='needrtw'&&v.type!=='rtw'&&v.type!=='asb') return false;
 v.st='toScene'; v.inc=inc.id; startTrip(v,inc,v.dolm?1:0);
 if(!inc.vehs.includes(v.id)) inc.vehs.push(v.id);
 if(inc.st==='alarm') inc.st='enroute';
 inc.log.push({t:G.t,k:'info',x:`${v.id} (${vCrewText(v)}) rückt aus. ETA ${hhmm(G.t+v.trip.dur)} Uhr.`});
 logEv('einsatz',`${v.id} (${vCrewText(v)}) rückt aus zu #${inc.id} ${inc.code}, ${inc.addr}. ETA ${hhmm(G.t+v.trip.dur)} Uhr.`);
 return true;
}
function sceneVehs(inc){ return inc.vehs.map(vehById).filter(v=>v&&v.st==='scene'&&v.inc===inc.id); }
function sceneRank(inc){ let r=0; sceneVehs(inc).forEach(v=>{ r=Math.max(r,vehRank(v)); }); return r; }
function fisuOnScene(inc){ return sceneVehs(inc).some(isSpec); }
function immName(inc){ const sp=specOnScene(inc); if(!sp) return 'die Besatzung'; return sp.type==='nef'?sp.id:'Roni'; }
function specOnScene(inc){ return sceneVehs(inc).find(isSpec); }
function rtwOnScene(inc){ return sceneVehs(inc).find(v=>v.type==='rtw'); }
function penVeh(inc){ return sceneVehs(inc).find(v=>v.pen); }

/* ---------- Eintreffen ---------- */
function onArriveScene(v,inc){
 v.st='scene'; v.x=inc.x; v.y=inc.y; v.trip=null;
 inc.log.push({t:G.t,k:'info',x:`${v.id} trifft ein (${vCrewText(v)}).`});
 logEv('einsatz',`${v.id} trifft bei #${inc.id} ${inc.code} ein.`);
 toast(`${v.id} ist vor Ort: ${inc.addr}`,'info',inc.id);
 if(v.type==='asb'){
  inc.log.push({t:G.t,k:'crit',x:'Der ASB-RTW trifft ein. Der Patient verstirbt kurz nach dem Eintreffen.'});
  inc.cur=null; G.stats.died++;
  settle(inc,{kind:'asb'}); return;
 }
 if(inc.st==='needrtw'&&v.type==='rtw'){
  inc.st='decide'; inc.log.push({t:G.t,k:'info',x:'Der nachgeforderte RTW übernimmt den Transport.'}); return;
 }
 if(inc.st==='enroute'||inc.st==='alarm'){
  inc.st='scene'; inc.sceneT=G.t;
  inc.log.push({t:G.t,k:'story',x:inc.d.story});
  /* Denis ohne Dolmetscher */
  const dv=v.crew.includes('Denis')&&!v.dolm;
  if(dv&&Math.random()<.45){
   inc.log.push({t:G.t,k:'event',x:'Sprachbarriere: Denis versteht die Angehörigen nur teilweise. „Nitro… Tablette?“ Das kostet Kraft.'});
   v.crew.forEach(n=>{ G.crew[n].en=Math.max(0,G.crew[n].en-8); });
  }
  beginStep(inc);
 }
}
function arrivedAllSceneCheck(inc){ return sceneVehs(inc).length>0; }

/* ---------- Fragen ---------- */
function visibleOpts(inc,step){
 const rank=sceneRank(inc);
 const lim=DIFFS[G.diff].opts;
 const pv=penVeh(inc);
 let av=[];
 step.opts.forEach((op,idx)=>{
  const need=op.c==='NA'?0:(RANK[op.c]!==undefined?RANK[op.c]:1);
  if(need>rank) return;
  av.push({idx,lock:(op.med==='penthrop'&&!pv)?'Penthrop leer – bei Andi nachholen':null});
 });
 if(av.length>lim){
  const oks=av.filter(a=>step.opts[a.idx].ok&&!a.lock), bad=shuffle(av.filter(a=>!step.opts[a.idx].ok));
  const best=oks.find(a=>step.opts[a.idx].best);
  const keep=[best||shuffle(oks)[0]].filter(Boolean);
  if(Math.random()<.35&&oks.length>1){ const o2=shuffle(oks).find(a=>a!==keep[0]); if(o2) keep.push(o2); }
  for(const b of bad){ if(keep.length>=lim) break; keep.push(b); }
  av=keep;
 }
 return shuffle(av);
}
function beginStep(inc){
 const st=inc.d.steps[inc.step];
 if(!st){ finishSteps(inc); return; }
 const list=visibleOpts(inc,st);
 let tmax=DIFFS[G.diff].qTime;
 const lowE=sceneVehs(inc).some(v=>v.crew.some(n=>G.crew[n].en<50));
 if(lowE) tmax*=.75;
 inc.cur={i:inc.step,list,sel:-1,tleft:tmax,tmax,done:false,timeout:false};
}
function finishSteps(inc){
 inc.cur=null;
 if(inc.d.dead){ inc.st='decide'; inc.log.push({t:G.t,k:'info',x:'Todesfeststellung abgeschlossen. Dokumentation und Verständigung sind erledigt.'}); return; }
 inc.st='decide';
 inc.log.push({t:G.t,k:'info',x:'Erstversorgung abgeschlossen. Entscheidung: Patient belassen (Revers) oder Transport?'});
}
function drainCrew(inc,amt){
 sceneVehs(inc).forEach(v=>v.crew.forEach(n=>{ G.crew[n].en=Math.max(0,G.crew[n].en-amt); }));
}
function complication(inc){
 inc.log.push({t:G.t,k:'event',x:pick(COMPL)});
 drainCrew(inc,5);
}
function answer(iid,k){
 const inc=incById(iid); if(!inc||!inc.cur||inc.cur.done) return;
 const cur=inc.cur, st=inc.d.steps[cur.i], item=cur.list[k]; if(!item||item.lock) return;
 const op=st.opts[item.idx];
 cur.sel=k; cur.done=true;
 if(op.med){ inc.meds.push(op.med); }
 if(op.med==='penthrop'){ const pv=penVeh(inc); if(pv&&pv.type!=='nef'){ pv.pen=false; } inc.pen=true; }
 if(op.sets) Object.assign(inc.sets,op.sets);
 if(op.ok){
  inc.okSteps++; if(op.best) inc.best++;
  inc.log.push({t:G.t,k:'ok',x:`<b>✔ ${esc(op.t)}</b>`,sub:op.res||op.fb});
 } else {
  inc.err++; drainCrew(inc,3);
  inc.log.push({t:G.t,k:op.crit?'crit':'bad',x:`<b>✘ ${esc(op.t)}</b>`,sub:op.fb});
  if(op.crit){ inc.crit++; addNerven(-2,'Kritischer Fehler'); drainCrew(inc,5); complication(inc); }
  else if(Math.random()<.35) complication(inc);
 }
 /* Zufallsereignis */
 if(Math.random()<DIFFS[G.diff].ev){ inc.log.push({t:G.t,k:'event',x:pick(EVENTS)}); drainCrew(inc,2); inc.ev++; }
 sfx(op.ok?'ok':'bad');
}
function nextStep(iid){
 const inc=incById(iid); if(!inc||!inc.cur||!inc.cur.done) return;
 inc.step++; beginStep(inc);
}
function timeoutStep(inc){
 const cur=inc.cur; if(!cur||cur.done) return;
 cur.done=true; cur.sel=-2; cur.timeout=true;
 inc.err++; drainCrew(inc,3);
 inc.log.push({t:G.t,k:'bad',x:'<b>⏱ Keine Entscheidung rechtzeitig getroffen.</b>',sub:'Die Zeit ist abgelaufen. Das zählt als Fehler.'});
 complication(inc);
 sfx('bad');
}

/* ---------- Aviso-Logik (ED-16/1) ---------- */
function needAviso(inc){
 const d=inc.d, v=d.vit, f=d.flags||{}, why=[];
 if(f.stemi) why.push('STEMI/NSTEMI zur PCI (ED-P17/P20)');
 if(f.stroke) why.push('Verdacht auf Schlaganfall/TIA/ICB (ED-P22/P25)');
 if(d.bit) why.push('Bariatrischer Patient, nur mit BIT transportierbar');
 if(d.trauma&&d.tr&&d.tr.length) why.push('Traumakriterium: '+d.tr[0]);
 if(f.airway) why.push('A: (drohende) Atemwegsverlegung');
 if(v.spo2>0&&v.spo2<=85) why.push('B: SpO₂ ≤ 85 % unter Raumluft');
 if(v.af>0&&v.af<=6) why.push('B: Atemfrequenz ≤ 6/min');
 if(v.af>=30) why.push('B: Atemfrequenz ≥ 30/min');
 if(inc.sets.niv) why.push('B: NIV begonnen');
 if(f.exhaust) why.push('B: drohende respiratorische Erschöpfung');
 if(f.inhal) why.push('B: Inhalationstrauma');
 const sbp=parseInt(String(v.bp).split('/')[0],10);
 if(!isNaN(sbp)&&sbp>0&&sbp<80) why.push('C: systolischer RR < 80 mmHg');
 if(v.hr>0&&v.hr<=40) why.push('C: Herzfrequenz ≤ 40/min');
 if(v.hr>=180) why.push('C: Herzfrequenz ≥ 180/min');
 if(d.cpr) why.push('C: Reanimation / ROSC');
 if(inc.sets.kat) why.push('C: Katecholamin (Epinephrin) eingesetzt');
 if(v.gcs>0&&v.gcs<=9) why.push('D: GCS ≤ 9');
 if(f.statusEpi) why.push('D: Status epilepticus');
 if(f.noProtect) why.push('D: fehlende Schutzreflexe');
 if(f.neuroDef) why.push('D: akutes neurologisches Defizit / Meningitis');
 if(v.temp>0&&v.temp<=32) why.push('E: Hypothermie ≤ 32 °C');
 if(v.temp>=40) why.push('E: Hyperthermie ≥ 40 °C');
 if(f.sepsis) why.push('E: qSOFA ≥ 2 / Sepsisverdacht');
 if(f.metab) why.push('E: schwere metabolische Störung');
 if(d.aviso===true&&!why.length) why.push(d.cpr?'Reanimation':'Sonderfall laut SOP: Aviso Zielabteilung');
 if(d.aviso===false) return {need:false,why:[]};
 return {need:why.length>0,why};
}

/* ---------- Zielambulanz-Prüfung ---------- */
function pciOK(hid,inc,day,hour){
 const rule=pciRule(day,hour);
 const h=HMAP[hid]; if(!h.svc.includes('PCI')) return {ok:false,why:`${h.name} hat kein Herzkatheter-Labor.`};
 if(rule.mode==='fix'){
  const ok=hid===rule.h||hid==='AKH';
  return {ok,why:ok?'':`PCI-Zentrum nach Dienstplan: ${HMAP[rule.h].name} (${rule.txt}).`};
 }
 const pcis=HOSPITALS.filter(x=>x.svc.includes('PCI')).map(x=>({id:x.id,m:driveMin(inc,x)})).sort((a,b)=>a.m-b.m);
 const ok=hid===pcis[0].id||hid==='KFL'||driveMin(inc,HMAP[hid])<=pcis[0].m+1;
 return {ok,why:ok?'':`Mo–Fr 08–13 Uhr gilt das nächstgelegene PCI-Zentrum: ${HMAP[pcis[0].id].name}.`};
}
function destOK(inc,hid,day,hour){
 const h=HMAP[hid], dd=inc.d.dest;
 if(!dd) return {ok:true,why:''};
 if(dd.special==='PCI') return pciOK(hid,inc,day,hour);
 if(dd.special==='FRUEH'){
  const ok=fruehOK(hid,inc.d.ssw,inc.d.twins);
  return {ok,why:ok?'':`Für die ${inc.d.ssw}. SSW${inc.d.twins?' (Zwillinge)':''} ist ${h.name} laut Frühgeburten-Tabelle nicht zuständig.`};
 }
 if(dd.special==='AKH'){ const ok=hid==='AKH'; return {ok,why:ok?'':'eCPR wird im AKH Wien durchgeführt (ED-P07).'}; }
 if(dd.special==='DCI'){ const ok=hid==='GRZ'||hid==='AKH'; return {ok,why:ok?'':'Tauchunfall: Druckkammer Graz, bei Absage Schwerpunktklinik (AKH) mit Aviso (ED-P47).'}; }
 if(dd.special==='VAD'){ const ok=hid==='AKH'; return {ok,why:ok?'':'VAD-Patienten gehören ins VAD-Zentrum (AKH Wien).'}; }
 const hit=dd.ok.some(t=>h.svc.includes(t));
 if(!hit) return {ok:false,why:`${h.name} bietet nicht: ${dd.ok.map(t=>AMBS[t].n).join(' / ')}.`};
 if(dd.special==='STU'&&!h.svc.includes('STU')) return {ok:false,why:`${h.name} hat keine Stroke Unit.`};
 return {ok:true,why:''};
}
function hospSorted(pos){
 return HOSPITALS.map(h=>({h,m:driveMin(pos,h)})).sort((a,b)=>a.m-b.m);
}

function openTransportFlow(iid){
 const inc=incById(iid); if(!inc) return;
 const tv=rtwOnScene(inc);
 if(!tv){ toast('Fisu und Notarzt transportieren nicht selbst – RTW nachfordern!','warn'); return; }
 TF={iid,stage:0,aviso:null,dest:null,eta:null,depart:G.t,day:dayIdx(),hour:hourOf(),tv:tv.id,refOpen:false};
 openModal('transport');
}
let TF=null;
function etaOptions(inc,hid,depart){
 const m=Math.ceil(driveMin(inc,HMAP[hid]));
 const base=Math.floor(absMin(depart))+m;
 const f=x=>{ const mm=((x%1440)+1440)%1440; return String(Math.floor(mm/60)).padStart(2,'0')+':'+String(mm%60).padStart(2,'0')+' Uhr'; };
 const correct=f(base);
 const set=[{t:correct,ok:true}];
 const offs=shuffle([-9,-6,8,11,15]);
 set.push({t:f(base+offs[0]),ok:false}); set.push({t:f(base+offs[1]),ok:false});
 set.push({t:`in ${m} Minuten`,ok:false,span:true});
 return {opts:shuffle(set),correct,m};
}
function confirmTransport(){
 const inc=incById(TF.iid); if(!inc) return;
 const tv=vehById(TF.tv);
 inc.tx={aviso:TF.aviso,dest:TF.dest,eta:TF.eta,etaOK:TF.etaCorrect,depart:TF.depart,day:TF.day,hour:TF.hour,vid:tv.id};
 inc.st='transport';
 const h=HMAP[TF.dest];
 inc.log.push({t:G.t,k:'info',x:`Abfahrt mit ${tv.id} nach ${h.name}.`+(TF.aviso?` Aviso an Leitstelle (DW 702680), Eintreffen ${TF.eta||'?'}.`:' Eintreffzeit an Leitstelle gemeldet.')});
 if(TF.aviso) inc.log.push({t:G.t,k:'radio',x:deliverText(inc)});
 /* weitere Fahrzeuge freigeben */
 sceneVehs(inc).forEach(v=>{
  if(v===tv) return;
  if(isSpec(v)){ v.st='return'; v.inc=null; v.runs++; startTrip(v,homeOf(v)); }
  else { v.st='cool'; v.cd=1; v.inc=null; }
 });
 tv.st='toHosp'; tv.inc=inc.id; startTrip(tv,h);
 sfx('go');
}
function deliverText(inc){

 return `<b>AVISO DELIVER → ${h.name}</b><br>D: ${inc.g==='f'?'weiblich':'männlich'}, ${inc.age} J., ${inc.addr}, ${inc.plz} Wien<br>E: ${d.label} (${inc.code})<br>L: SpO₂ ${v.spo2||'–'} %, HF ${v.hr||'–'}, RR ${v.bp}, AF ${v.af||'–'}, GCS ${v.gcs}<br>I: ${done||'Basismaßnahmen'}<br>V: Zustand aktuell stabil unter Therapie<br>E: SAMPLER liegt vor, Infektionsstatus unauffällig<br>R: Eintreffen ${inc.tx.eta||'–'}`;
}

 inc.log.push({t:G.t,k:live?'ok':'crit',x:text});
 G.stats.belassen++;
 settle(inc,{kind:'belassen',live,immune,text});
}

/* ---------- Abschluss ---------- */
function cooldownFor(inc,fail){
 const base={A:1,B:1.3,C:1.8,D:2.3,E:2.8}[inc.lvl]||1.5;
 return clamp(base+0.5*inc.meds.length+(fail?0.5:0)+(inc.pen?0.3:0),1,4);
}
function bump(k,n){ if(!G) return; G.stats[k]=(G.stats[k]||0)+(n===undefined?1:n); }
function nMax(){ return G&&G.hulkMode?300:(G&&G.psy?200:100); }
function checkNerven(){
 if(typeof shopCheck==='function'){ shopCheck(); chefCheck(); }
 if(G.nerven<=0&&!G.over){ G.chef=null; if(typeof CHEFRT!=='undefined') CHEFRT=null; G.over='lose'; showEnd('lose'); }
 else if(!G.psy&&G.nerven>=100&&!G.over){ G.over='win'; showEnd('win'); }
 else if(G.psy&&!G.hulkMode&&G.nerven>=200) unlockMutation();
 else if(G.hulkMode&&G.nerven>=300&&!G.nukeUnlocked) unlockNuke();
}
function startPsy(){
 G.over=null; G.psy=true; G.nerven=Math.min(G.nerven,100);
 logEv('mutation','Psychose-Modus gestartet: Nervenbalken bis 200. Bei 200 wird „Mutation“ freigeschaltet.');
}

 G.mutUnlocked=true; G.hulkMode=true;

function addNerven(n,why){
 if(!n||!G) return;
 G.nerven=clamp(G.nerven+n,0,nMax());
 floatNerven(n,why);
 checkNerven();
}
function crewOfInc(inc){
 const set=[]; inc.vehs.forEach(id=>{ const v=vehById(id); if(v) v.crew.forEach(n=>{ if(!set.includes(n)) set.push(n); }); });
 return set;
}
const OFF_CHANCE=0.2;
const PAUSE_TXT=['„Wir haben seit Stunden nichts gegessen. Dürfen wir kurz zum Billa?“','„Mein Magen knurrt lauter als das Folgetonhorn. Pause?“','„Nur eine kleine Jause, bitte! Danach fahren wir wieder alles.“'];
function rollOff(v){
 if(!G||v.offT>0||Math.random()>OFF_CHANCE) return;
 const r=Math.random();
 if(r<.4){ v.offWhy='Putzen'; v.offT=rnd(6,12); logEv('fahrzeug',`${v.id} muss geputzt werden (${v.offT} Min nicht einsatzbereit).`); toast(`🧽 <b>${v.id}</b> muss geputzt werden: ${v.offT} Min nicht einsatzbereit.`,'warn'); }
 else if(r<.75){ v.offWhy='Medikamente nachfassen'; v.offT=rnd(5,9); logEv('fahrzeug',`${v.id} muss Medikamente nachfassen (${v.offT} Min nicht einsatzbereit).`); toast(`💊 <b>${v.id}</b> muss Medikamente nachfassen: ${v.offT} Min nicht einsatzbereit.`,'warn'); }
 else { v.offWhy='Wartet'; v.offT=0.01; logEv('fahrzeug',`${v.id} bittet um Essenspause.`); if(typeof askPause==='function') askPause(v.id); else { v.offT=0; v.offWhy=null; } }
}
function finishVehicles(inc,cd,transportVeh){
 const done=[];
 sceneVehs(inc).forEach(v=>{
  v.inc=null; done.push(v);
  if(isSpec(v)){ v.st='return'; v.runs++; startTrip(v,homeOf(v)); }
  else { v.st='cool'; v.cd=cd; }
 });
 if(transportVeh){ transportVeh.st='cool'; transportVeh.cd=cd; transportVeh.inc=null; transportVeh.trip=null; done.push(transportVeh); }
 done.forEach(rollOff);
}
function bumpCrew(names,fail,lvl){
 const drain=5+1.5*(LEVEL_IDX[lvl]||2)+(fail?12:0);
 names.forEach(n=>{ const c=G.crew[n]; if(c.hulk){ c.runs++; return; } c.en=Math.max(0,c.en-drain); c.runs++; if(n==='Berni') c.berniRuns++; });
}
function checkBerni(names){
 if(names.includes('Berni')){

  fail=!(ev.avOK&&ev.dOK.ok&&treatOk);

  const near=hospSorted(inc).find(x=>destOK(inc,x.h.id,inc.tx.day,inc.tx.hour).ok);

 } else if(o.kind==='hulk'){

 } else if(o.kind==='dead'){

 }

 const names=crewOfInc(inc);
 const rtwNames=[]; inc.vehs.map(vehById).forEach(v=>{ if(v&&v.type==='rtw') v.crew.forEach(x=>{ if(!rtwNames.includes(x)) rtwNames.push(x); }); });

 if(o.kind==='hulk'){ rep.title='Keine Konsequenzen'; rep.sub='HULK hat den Patienten erledigt. Weder Nerven noch Maut.'; }
 else if(o.kind==='weapon'){ rep.title='Patient erschossen · doppelte Nerven'; rep.sub='Der Einsatz gilt als bestmöglich abgeschlossen, mal zwei.'; }

 else if(o.kind==='belassen'&&!o.live){ rep.title='Patient verstorben'; rep.sub='Die Besatzung wird zum HIO beordert.'; }

 rep.hio=hioNeeded; rep.text=o.text||'';
 { const det=[]; rep.lines.forEach(l=>det.push((l.ok?'✔ ':'✘ ')+l.txt+(l.why?' – '+l.why:'')));

function tickBuffs(dt){

/* ---------- Speichern ---------- */
const SLOTS_KEY='mariahilf-sim-2026-slots-v1';
const MAX_SLOTS=10;
function readSlots(){
 try{
  let arr=JSON.parse(localStorage.getItem(SLOTS_KEY)||'null');
  if(!Array.isArray(arr)){
   arr=[];
   const old=localStorage.getItem(SAVE_KEY);
   if(old){ try{ const o=JSON.parse(old); arr.push({id:'s'+Date.now(),name:'Alter Spielstand',ts:Date.now(),diff:o.diff,t:o.t,nerven:o.nerven,maut:o.maut||0,data:old}); localStorage.setItem(SLOTS_KEY,JSON.stringify(arr)); }catch(e){} }
  }
  return arr;
 }catch(e){ return []; }
}
function writeSlots(arr){ try{ localStorage.setItem(SLOTS_KEY,JSON.stringify(arr)); return true; }catch(e){ return false; } }
function hasSave(){ return readSlots().length>0; }
function slotMeta(){ return {ts:Date.now(),diff:G.diff,t:G.t,nerven:Math.round(G.nerven),maut:G.maut}; }
/* id leer: neuer Spielstand. id gesetzt: überschreiben (Name bleibt) */
function saveToSlot(id,name,auto){
 const arr=readSlots();
 let slot=id?arr.find(x=>x.id===id):null;
 if(!slot){
  if(arr.length>=MAX_SLOTS) return {ok:false,why:'full'};
  slot={id:'s'+Date.now()+Math.floor(Math.random()*999),name:name||('Spielstand '+(arr.length+1))};
  arr.unshift(slot);
 }
 G.slot=slot.id; G.slotName=slot.name; G.savedT=G.t; G.savedAt=Date.now(); G.savedAuto=!!auto; G.autoT=G.t;
 Object.assign(slot,slotMeta(),{data:JSON.stringify(G)});
 if(!writeSlots(arr)) return {ok:false,why:'storage'};
 return {ok:true,slot};
}
/* Testhilfe: Spielzeit vor-/zurückspulen (alle Minuten im Spiel, auch Trainings, Timer, Uhrzeit) */
function shiftGameTime(dm){
 if(!G||!dm) return;
 if(dm<0){ const back=Math.min(-dm,G.t); G.t-=back; logEv('system',`Testhilfe: Spielzeit −${Math.round(back/60*10)/10} Std. (jetzt ${hhmm(G.t)} Uhr).`); toast(`⏪ Spielzeit −${Math.round(back)} Min. · ${hhmm(G.t)} Uhr`,'info'); sfx('tap'); return; }
 const pa=PAUSED; let left=dm; const step=5;
 while(left>0){
  if(MODAL_OPEN>0||G.chef||G.endShown) break;
  const s=Math.min(step,left), t0=G.t; PAUSED=false; tickGame(s*5/SPEED); if(G.t-t0<0.001) break; left-=(G.t-t0);
 }
 PAUSED=pa;
 if(left>0) G.t+=left;
 skillTick(); hulkTick();
 logEv('system',`Testhilfe: Spielzeit +${Math.round(dm/60*10)/10} Std. (jetzt ${hhmm(G.t)} Uhr).`); toast(`⏩ Spielzeit +${dm} Min. · ${hhmm(G.t)} Uhr`,'info'); sfx('tap');
}
/* Autosave: jede volle Spielstunde in den aktuellen Spielstand (oder neuer Slot „Autosave“) */
const AUTOSAVE_MIN=60;
function autoSaveTick(){
 if(G.autoT===undefined||G.autoT>G.t) G.autoT=G.t;
 if(G.t-G.autoT<AUTOSAVE_MIN) return;
 G.autoT=G.t;
 try{ const r=saveToSlot(G.slot||null,G.slot?undefined:'Autosave',true); if(!r.ok) G.autoFail=true; else G.autoFail=false; }catch(e){ G.autoFail=true; }
}
function loadSlot(id){
 const slot=readSlots().find(x=>x.id===id); if(!slot) return false;
 try{ const o=JSON.parse(slot.data); if(!o||!o.crew) return false; G=o; G.slot=slot.id; G.slotName=slot.name; G.savedT=G.t; G.autoT=G.t; G.savedAt=slot.ts; migrate(); G.endShown=false; return true; }catch(e){ return false; }
}
function deleteSlot(id){ const arr=readSlots().filter(x=>x.id!==id); if(G&&G.slot===id){ G.slot=null; G.slotName=null; } return writeSlots(arr); }
function renameSlot(id,name){
 name=(name||'').trim().slice(0,32); if(!name) return false;
 const arr=readSlots(); const s=arr.find(x=>x.id===id); if(!s) return false;
 s.name=name; if(G&&G.slot===id) G.slotName=name;
 return writeSlots(arr);
}
/* Kompatibilität: Schnellspeichern / letzten Stand laden */
function saveGame(){ const r=saveToSlot(G&&G.slot?G.slot:null); return r.ok; }
function loadGame(){ const arr=readSlots(); if(!arr.length) return false; const s=arr.slice().sort((a,b)=>b.ts-a.ts)[0]; return loadSlot(s.id); }

let AC=null;
function ensureAudio(){ if(!SOUND) return null; try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); } if(AC&&AC.state==='suspended') AC.resume(); }catch(e){ AC=null; } return AC; }
function tone(f,d,type,vol,delay){
 const a=ensureAudio(); if(!a) return;
 try{ const o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.value=f;
  const t0=a.currentTime+(delay||0); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.06,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+0.05); }catch(e){}
}

 });

  const p=MAP.pointers.get(e.pointerId); if(!p) return;
  const {w,h}=mapSize(); const W=560/MAP.z; const k=W/w;
  if(MAP.pointers.size===1){
   const dx=e.clientX-p.x, dy=e.clientY-p.y;
   MAP.moved+=Math.abs(dx)+Math.abs(dy);
   if(MAP.moved>6){ MAP.cx-=dx*k; MAP.cy-=dy*k; applyView(); }
  } else if(MAP.pointers.size===2&&MAP.pinch0){
   p.x=e.clientX; p.y=e.clientY;
   const [a,b]=Array.from(MAP.pointers.values()); const d=Math.hypot(a.x-b.x,a.y-b.y);
   const nz=clamp(MAP.pinch0.z*d/MAP.pinch0.d,.6,6); MAP.moved+=20;
   const r=svg.getBoundingClientRect(); mapZoom(nz/MAP.z,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);
  }

 });

/* ---------- Einsatzliste ---------- */
function incStateInfo(inc){
 const D=DIFFS[G.diff];
 if(inc.st==='alarm'){
  const lim=D.patience*(inc.lvl==='D'||inc.lvl==='E'?.6:1); const left=Math.max(0,lim-(G.t-inc.born));
  return {txt:`Unbesetzt · noch ${Math.ceil(left)} Min`,cls:'warn',pct:left/lim};
 }
 if(inc.st==='enroute'){
  let best=null; inc.vehs.map(vehById).forEach(v=>{ if(v&&v.st==='toScene'&&v.trip){ const r=v.trip.dur-v.trip.el; if(best===null||r<best.r) best={r,v}; } });
  return {txt:best?`Anfahrt ${best.v.id} · Ankunft ${hhmm(G.t+best.r)}`:'Anfahrt',cls:'info',pct:best?clamp(1-best.r/Math.max(1,best.v.trip.dur),0,1):0};
 }
 if(inc.st==='scene'){
  const c=inc.cur;
  if(c&&!c.done) return {txt:`Frage ${c.i+1}/${inc.d.steps.length} · ${Math.ceil(c.tleft)} s`,cls:'q',pct:c.tleft/c.tmax};
  if(c&&c.done) return {txt:'Antwort auswerten',cls:'q',pct:1};
  return {txt:'Vor Ort',cls:'info',pct:1};
 }
 if(inc.st==='decide') return {txt:inc.d.dead?'Einsatz abschließen':'Entscheidung offen',cls:'q',pct:1};
 if(inc.st==='needrtw') return {txt:'RTW nachfordern!',cls:'warn',pct:1};
 if(inc.st==='transport'){
  const v=vehById(inc.tx.vid); const r=v&&v.trip?v.trip.dur-v.trip.el:0;
  return {txt:`Transport → ${inc.tx.dest} · ${hhmm(G.t+r)}`,cls:'tx',pct:v&&v.trip?clamp(v.trip.el/v.trip.dur,0,1):1};
 }
 return {txt:'',cls:'',pct:0};
}

 setHTML(box,pauseCards+fuelCards+list.map(inc=>{
  const s=incStateInfo(inc); const col=LVL_COL[inc.lvl];
  return `<button class="inc ${s.cls}" data-a="openInc" data-id="${inc.id}" style="--lc:${col}">

  </button>`;

function chefCheck(){
 if(!G||!G.started||G.over||G.endShown) return;
 if(G.nerven>=10){ G.chefLow=false; return; }
 if(G.nerven<=0||G.chefLow||G.chef) return;
 G.chefLow=true;
 const second=(G.chefCount||0)>=1;
 G.chefCount=(G.chefCount||0)+1;
 G.chef={mode:second?'second':'first',phase:'talk'};
 logEv('system',second?'Nerven unter 10: erneut zu den Chefitäten gerufen.':'Nerven unter 10: zu den Chefitäten ins Büro gerufen.');

function chefScript(){
 const c=G.chef;
 if(c.phase==='plead') return {lines:CHEF_PLEAD,ms:CHEF_PLEAD.length*3200};
 if(c.mode==='second') return {lines:CHEF_SECOND,ms:CHEF_SECOND.length*3000};
 return {lines:CHEF_TALK,ms:CHEF_MS};
}
function chefBegin(){
 const c=G.chef; if(!c) return;
 if(c.phase==='ask'||c.phase==='fired'||c.phase==='over'){ CHEFRT=null; chefRender(); return; }
 const s=chefScript(); const w=s.lines.map(l=>l[1].length+25); const tot=w.reduce((a,b)=>a+b,0);
 let acc=0; const st=w.map(x=>{ const t=acc/tot*s.ms; acc+=x; return t; });
 CHEFRT={t0:performance.now(),lines:s.lines,st,ms:s.ms,shown:0};
 chefRender();
}
function chefBubble(l){
 const k=l[0]==='Du'?'du':(l[0]==='HIO'?'hio':(l[0]==='BK'?'bk':'ik'));
 return `<div class="cb ${k}"><b>${esc(l[0])}</b><p>${esc(l[1])}</p></div>`;
}
function chefRender(){
 const box=$('#chefBody'); if(!box||!G||!G.chef) return;
 const c=G.chef; let act='', logh='';
 if(CHEFRT){ logh=CHEFRT.lines.slice(0,CHEFRT.shown).map(chefBubble).join(''); }
 else if(c.phase==='ask'){ logh=CHEF_TALK.map(chefBubble).join(''); }
 else if(c.phase==='fired'||c.phase==='over'){
  const ls=c.mode==='second'?CHEF_SECOND:CHEF_PLEAD; logh=ls.map(chefBubble).join('');
 }
 if(c.phase==='ask') act=`<div class="chefq"><b>Bist du damit einverstanden?</b><span>Hast du verstanden, welchen Fehler du gemacht hast?</span>
  <button class="btn go big" data-a="chefyes">Ja, ich habe verstanden</button>
  <button class="btn danger" data-a="chefno">Nein, ich bin nicht einverstanden</button></div>`;
 else if(c.phase==='fired') act=`<div class="chefq fired"><h3>GEKÜNDIGT</h3><span>Dein Dienstverhältnis bei der Berufsrettung ist beendet. Spiel vorbei.</span><b>Möchtest du dich erneut bei der Berufsrettung bewerben?</b>
  <button class="btn go big" data-a="chefapply">Ja, erneut bewerben (+30 Nerven)</button>
  <button class="btn" data-a="chefquit">Nein</button></div>`;
 else if(c.phase==='over') act=`<div class="chefq fired"><h3>SPIEL VORBEI</h3><span>Du hast dich nicht erneut beworben.</span><button class="btn go big" data-a="restartNow">Neues Spiel</button></div>`;
 const head=c.mode==='second'?'Erneut ins Büro gerufen':'Gespräch bei den Chefitäten';
 box.innerHTML=`<div class="chefroom"><div class="chefhead"><b>${head}</b><span id="chefClock"></span></div><div class="chefbar"><i id="chefFill"></i></div><div id="chefLog">${logh}</div>${act}</div>`;

}
function chefTick(){
 if(!G||!G.chef||!CHEFRT) return;
 const R=CHEFRT; const el=performance.now()-R.t0; const c=G.chef;
 let added=false; const lg=$('#chefLog');
 while(R.shown<R.lines.length&&el>=R.st[R.shown]){ if(lg) lg.insertAdjacentHTML('beforeend',chefBubble(R.lines[R.shown])); R.shown++; added=true; sfx('tap'); }
 if(added&&lg) lg.scrollTop=lg.scrollHeight;
 const f=$('#chefFill'); if(f) f.style.width=Math.min(100,el/R.ms*100)+'%';
 const k=$('#chefClock'); if(k){ const left=Math.max(0,Math.ceil((R.ms-el)/1000)); k.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); }
 if(el>=R.ms+1500&&R.shown>=R.lines.length){
  CHEFRT=null;
  if(c.phase==='talk'&&c.mode==='first') c.phase='ask';
  else { c.phase='fired'; logEv('system','Gekündigt (Chefitäten).'); sfx('bad'); }
  chefRender();
 }
}
function chefAction(a){
 const c=G.chef; if(!c) return;
 if(a==='chefyes'){
  logEv('system','Chefitäten: Einverstanden. Mündliche Verwarnung erteilt, +30 Nerven.');
  G.chef=null; CHEFRT=null; G.chefLow=false; sfx('ok');
  addNerven(30,'Verwarnung');
  toast('Mündliche Verwarnung erteilt. +30 Nerven. Zurück an die Arbeit.','warn');
  setTab('map');
 } else if(a==='chefno'){
  logEv('system','Chefitäten: Nicht einverstanden. Kündigung.');
  c.phase='plead'; chefBegin();
 } else if(a==='chefapply'){
  logEv('system','Erneut bei der Berufsrettung beworben: +30 Nerven.');
  G.chef=null; CHEFRT=null; G.chefLow=false; sfx('win');
  addNerven(30,'Neubewerbung');

  setTab('map');

  c.phase='over'; chefRender();
 }
}

/* =====================================================================
   SKILLS (Training im Shop) + Skill „Gauner“ (Patienten bestehlen)
   ===================================================================== */
const SKILLS_NERV=100;
const GAUNER_MAUT=[10,20];
const GAUNER_CD=60;
function gaunerCdLeft(n){ const c=G&&G.crew[n]; return c&&c.gaunerCd>G.t?Math.ceil(c.gaunerCd-G.t):0; }
function hasGauner(n){ const c=G&&G.crew[n]; return !!(c&&c.gauner&&c.st!=='dead'); }
function hasRaser(n){ const c=G&&G.crew[n]; return !!(c&&c.raser&&c.st!=='dead'); }
const RASER_FACTOR=0.7;
function raserFactor(v){ return (v&&v.crew&&v.crew.some(hasRaser))?RASER_FACTOR:1; }
function skIcons(n){ return (hasGauner(n)?'🦹':'')+(hasRaser(n)?'🏎️':''); }
function skItemTxt(d){ if(!d.item) return ''; const dr=DRUGS.find(x=>x.id===d.item); return ` + 1 ${dr.ic} ${dr.n}`; }
const SKILL_DEFS={
 gauner:{n:'Gauner',ic:'🦹',cost:18,min:120,uniq:true,desc:'Im Einsatz kann dieses Besatzungsmitglied den Patienten <b>bestehlen</b> (Minispiel). Erfolg bringt 10–20 Maut, danach hat der Skill 1 Spielstunde Abklingzeit. Wird er erwischt, schlägt der Patient zu und der Gauner endet am Friedhof.'},
 raser:{n:'Raser',ic:'🏎️',cost:18,item:'heroin',min:120,uniq:true,desc:'Fahrzeuge, auf denen der Raser sitzt, sind <b>30 % schneller</b> unterwegs (Anfahrt, Transport und Rückfahrt). Gelernt wird bei David in der Rettungsstation Penzing. Kostet 18 Maut und 1 Heroin aus deinem Dealer-Rucksack.'}
};
let SKOPEN={};
function skillHolder(id){ return STAFF.map(s=>s.n).find(n=>{ const c=G.crew[n]; return c&&c.st!=='dead'&&c[id]; })||null; }
function skillTrainee(id){ return STAFF.map(s=>s.n).find(n=>{ const c=G.crew[n]; return c&&c.st!=='dead'&&c.train&&c.train.id===id; })||null; }
/* Name mit Spezialfähigkeit (ähnlich Hari/Berni) */
function skName(n,big){ const ic=skIcons(n); return ic?`<span class="nametap sk${big?'':' sm'}">${esc(n)} <span>${ic}</span></span>`:esc(n); }
function skillBlock(n,id){
 const c=G.crew[n]; if(!c) return 'unbekannt';
 if(c.st==='dead') return 'tot';
 if(c[id]) return 'hat den Skill';
 if(c.train) return 'im Training';
 if(c.st==='neb') return 'krank (NEB)';
 if(c.st==='arrest') return 'verhaftet';
 const v=assignedTo(n); if(v) return 'auf '+v.id+' eingeteilt';
 return null;
}
function skillsShopHTML(){
 let h=`<p class="muted shopnote">Trainingsplatz. Nur wer auf der Wache ist und <b>keinem Fahrzeug</b> zugeteilt ist, kann trainieren. Ein Skill bleibt, solange das Besatzungsmitglied lebt.</p>`;
 Object.keys(SKILL_DEFS).forEach(id=>{
  const d=SKILL_DEFS[id], hold=skillHolder(id), tr=skillTrainee(id), open=!!SKOPEN[id];
  const stat=hold?`<em class="skst on">${esc(hold)}</em>`:(tr?`<em class="skst tr">Training: ${esc(tr)}</em>`:`<em class="skst">frei</em>`);
  h+=`<div class="skcard"><button class="skhead" data-a="skopen" data-id="${id}"><span class="skic">${d.ic}</span><span class="sknm"><b>${d.n}</b><small>🪙 ${d.cost} Maut${skItemTxt(d)} · ${d.min/60} Spielstunden</small></span>${stat}<span class="skarr">${open?'▾':'▸'}</span></button>`;
  if(open){
   h+=`<div class="skbody"><p class="muted">${d.desc}</p>`;
   if(d.uniq) h+=`<p class="muted skuniq">Nur <b>ein</b> Besatzungsmitglied kann diesen Skill tragen.${hold?` Aktuell: <b>${esc(hold)}</b>. Erst wenn ${esc(hold)} stirbt, kann jemand anderes ihn lernen.`:''}</p>`;
   const blockAll=d.uniq&&(hold||tr);
   const anyTr=STAFF.map(s=>s.n).find(n=>{ const c=G.crew[n]; return c&&c.st!=='dead'&&c.train; });
   if(anyTr){
    const c=G.crew[anyTr], td=SKILL_DEFS[c.train.id], left=Math.max(0,Math.ceil(c.train.until-G.t)), pct=Math.min(100,Math.round((1-left/td.min)*100));
    if(c.train.id!==id) h+=`<p class="muted">Gerade läuft ein anderes Training (${esc(anyTr)}: ${td.n}). Solange sind alle anderen Mitglieder ausgeblendet.</p>`;
    else h+=`<div class="trlive"><div class="trtop"><span class="av c-${STAFF.find(x=>x.n===anyTr).c.replace(/[^A-Z]/g,'')}${hk(anyTr)}">${initials(anyTr)}</span><b>${esc(anyTr)}</b><span class="skst tr">im Training</span></div>
     <div class="trbar"><i style="width:${pct}%"></i></div>
     <div class="trmeta"><span>${pct} % geschafft</span><span>noch ${Math.floor(left/60)} Std. ${left%60} Min. (Spielzeit)</span></div>
     <div class="trmeta"><span>${td.ic} ${td.n}</span><span>fertig um ${hhmm(c.train.until)} Uhr</span></div>
     <button class="btn mini trcancel" data-a="gcancel" data-n="${esc(anyTr)}">Training abbrechen · 🪙 ${td.cost}${td.item?' + '+DRUGS.find(x=>x.id===td.item).ic:''} zurück</button></div>`;
    h+=`</div></div>`; return;
   }
   h+=`<div class="skrows">`+STAFF.map(s=>{
    const why=skillBlock(s.n,id);
    const c=G.crew[s.n];
    let right;
    if(c[id]&&c.st!=='dead') right=`<span class="skhas">${d.ic} ${d.n}</span>`;
    else if(c.train&&c.train.id===id) right=`<small>Training noch ${Math.max(0,Math.ceil(c.train.until-G.t))} Min.</small>`;
    else if(why) right=`<small>${esc(why)}</small>`;
    else if(blockAll) right=`<small>Skill bereits vergeben</small>`;
    else if(G.maut<d.cost) right=`<button class="btn mini" disabled>🪙 ${d.cost} fehlt</button>`;
    else if(d.item&&!G.bag.includes(d.item)) right=`<button class="btn mini" disabled>${DRUGS.find(x=>x.id===d.item).ic} fehlt im Rucksack</button>`;
    else right=`<button class="btn mini trgo" data-a="gtrain" data-id="${id}" data-n="${esc(s.n)}">Training starten · 🪙 ${d.cost}${d.item?' + '+DRUGS.find(x=>x.id===d.item).ic:''}</button>`;
    return `<div class="skrow ${(why||blockAll)&&!(c.train&&c.train.id===id)?'no':''}"><span class="av c-${s.c.replace(/[^A-Z]/g,'')}${hk(s.n)}">${initials(s.n)}</span><b>${esc(s.n)}</b>${right}</div>`;
   }).join('')+`</div></div>`;
  }
  h+=`</div>`;
 });
 return h;
}
function trainSkill(id,n){
 const d=SKILL_DEFS[id], c=G&&G.crew[n]; if(!d||!c||!G.skillsUnlocked) return false;
 const why=skillBlock(n,id); if(why){ toast(`${esc(n)}: ${esc(why)}.`,'warn'); sfx('bad'); return false; }
 if(d.uniq&&(skillHolder(id)||skillTrainee(id))){ toast(`Der Skill ${d.n} ist schon vergeben.`,'warn'); sfx('bad'); return false; }
 if(G.maut<d.cost){ toast(`Zu wenig Maut. Es fehlen ${d.cost-G.maut} Maut.`,'warn'); sfx('bad'); return false; }
 if(d.item&&!G.bag.includes(d.item)){ toast(`Dir fehlt ${DRUGS.find(x=>x.id===d.item).n} im Rucksack. Kauf es beim Dealer.`,'warn'); sfx('bad'); return false; }
 G.maut-=d.cost; bump('spent',d.cost);
 if(d.item) G.bag.splice(G.bag.indexOf(d.item),1);
 c.train={id,until:G.t+d.min,item:d.item||null};
 logEv('skill',`${n} beginnt das Training „${d.n}“ (${d.cost} Maut${skItemTxt(d)}, ${d.min/60} Spielstunden).`);
 toast(`${d.ic} <b>${esc(n)}</b> trainiert jetzt ${d.n} (${d.min/60} Spielstunden).`,'info'); sfx('ok'); return true;
}
function cancelTraining(n){
 const c=G&&G.crew[n]; if(!c||!c.train) return false;
 const id=c.train.id, d=SKILL_DEFS[id]; if(c.train.item) G.bag.push(c.train.item); c.train=null; G.maut+=d.cost; bump('spent',-d.cost);
 logEv('skill',`${n} bricht das Training „${d.n}“ ab. ${d.cost} Maut${skItemTxt(d)} zurückerstattet.`);
 toast(`${d.ic} Training abgebrochen. <b>+${d.cost} Maut${d.item?' und '+DRUGS.find(x=>x.id===d.item).ic:''}</b> zurück.`,'info'); sfx('tap'); return true;
}
function skillTick(){
 STAFF.forEach(s=>{ const c=G.crew[s.n]; if(!c||!c.train) return;
  if(c.st==='dead'){ c.train=null; return; }
  if(G.t+0.001>=c.train.until){ const id=c.train.id, d=SKILL_DEFS[id]; c.train=null; c[id]=true;
   logEv('skill',`${s.n} hat das Training „${d.n}“ abgeschlossen.`); toast(`${d.ic} <b>${esc(s.n)}</b> ist jetzt ${d.n}.`,'info'); sfx('ok'); }
 });
}
function gaunerOnScene(inc){
 if(inc.stolen||inc.d.dead) return [];
 const out=[]; sceneVehs(inc).forEach(v=>v.crew.forEach(n=>{ if(hasGauner(n)&&G.crew[n].st==='ok'&&!out.includes(n)) out.push(n); }));
 return out;
}
function gaunerMenuHTML(inc){
 const g=gaunerOnScene(inc); if(!g.length) return '';
 return `<div class="gmenu"><div class="sphead"><span class="spbadge gb">GAUNER</span><b>Skill-Menü</b><small>Einmal pro Einsatz · Abklingzeit 1 Std.</small></div>`+
  g.map(n=>{ const cd=gaunerCdLeft(n); return `<button class="btn big gsteal" data-a="gsteal" data-n="${esc(n)}" data-i="${inc.id}" ${cd?'disabled':''}>🦹 ${esc(n)}: Patienten bestehlen${cd?`<small style="display:block;font-weight:600">Abklingzeit: noch ${cd} Min.</small>`:''}</button>`; }).join('')+
  `<p class="hintline">Erfolg: ${GAUNER_MAUT[0]}–${GAUNER_MAUT[1]} Maut. Scheitern: der Patient rastet aus und ${g.length>1?'der Gauner stirbt':'der Gauner stirbt'}.</p></div>`;
}
function gaunerDie(n,inc){
 const c=G.crew[n]; c.st='dead'; c.gauner=false;
 G.buffs=(G.buffs||[]).filter(x=>x.who!==n); unequipAll(n);
 inc.log.push({t:G.t,k:'crit',x:`${n} wurde beim Stehlen erwischt. Der Patient rastet aus und schlägt ${n} zu Tode.`});
 logEv('fehler',`${n} wurde beim Bestehlen von Patient #${inc.id} erwischt und erschlagen. −6 Nerven.`);
 toast(`💀 <b>${esc(n)}</b> wurde beim Stehlen erwischt und vom Patienten erschlagen. <b>−6 Nerven</b>`,'bad');
 addNerven(-6,'Beim Stehlen erwischt'); sfx('bad');
}
function gaunerAbort(inc,who){
 const vd=assignedTo(who); const partner=vd?vd.crew.filter(x=>x!==who&&G.crew[x]&&G.crew[x].st!=='dead'):[];
 const vid=vd?vd.id:null;
 unassign(who);
 sceneVehs(inc).forEach(v=>{ v.inc=null; v.runs++; v.st='return'; startTrip(v,homeOf(v)); });
 inc.vehs.map(vehById).forEach(v=>{ if(v&&v.st==='toScene'&&v.inc===inc.id){ v.st='return'; v.inc=null; startTrip(v,homeOf(v)); } });
 inc.cur=null; inc.st='closed';
 G.inc=G.inc.filter(i=>i.id!==inc.id);
 G.hist.unshift({id:inc.id,code:inc.code,label:inc.label,t:G.t,ok:false,delta:-6});
 if(G.hist.length>25) G.hist.pop();
 logEv('fehler',`Einsatz #${inc.id} ${inc.code} abgebrochen: ${who} ist tot. ${vid?vid+' fährt '+(partner.length?'mit '+partner.join(' & ')+' ':'')+'zurück zur Wache.':''}`);
 return {vid,partner};
}
function gaunerWin(n,inc){
 const m=rnd(GAUNER_MAUT[0],GAUNER_MAUT[1]); G.crew[n].gaunerCd=G.t+GAUNER_CD; G.maut+=m; bump('maut',m); bump('stolen');
 inc.log.push({t:G.t,k:'ok',x:`${n} hat dem Patienten unbemerkt die Geldbörse geleert (+${m} Maut).`});
 logEv('skill',`${n} bestiehlt Patient #${inc.id} erfolgreich: +${m} Maut. Maut-Stand ${G.maut}.`);
 toast(`🦹 ${esc(n)}: <b>+${m} Maut</b> erbeutet.`,'info'); sfx('ok');
}

/* ---------- Minispiel: Taschendieb ---------- */
const STEAL={on:false,inc:null,who:null,pausedBefore:null,raf:0,holding:false,prog:0,st:'closed',stT:0,last:0,total:0,over:false,msg:''};
const STEAL_LIMIT=15, STEAL_NEED=3.2;
function stealEnsure(){
 let ov=document.getElementById('stealOv'); if(ov) return ov;
 if(!document.getElementById('stealStyle')){ const st=document.createElement('style'); st.id='stealStyle'; st.textContent=`
#stealOv{position:absolute;inset:0;z-index:380;background:rgba(4,8,12,.92);display:flex;align-items:center;justify-content:center;padding:16px}
#stealOv[hidden]{display:none}
.stcard{width:100%;max-width:420px;background:#0f1a24;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:center}
.stcard h3{margin:0;font:800 18px var(--f-head);letter-spacing:.06em;text-transform:uppercase}
.stface{font-size:84px;line-height:1;transition:transform .12s}
.stface.open{transform:scale(1.12)}.stface.warn{animation:stshake .12s infinite}
@keyframes stshake{0%{transform:translateX(-4px)}50%{transform:translateX(4px)}100%{transform:translateX(-4px)}}
.stsay{min-height:22px;font-weight:700;color:var(--tx2)}.stsay.danger{color:#ff6b61}.stsay.safe{color:#5df0bd}
.stbar{height:16px;border-radius:99px;background:#18222d;overflow:hidden;border:1px solid var(--line)}.stbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ee6a6,#b6ffb0)}
.sttime{height:6px;border-radius:99px;background:#18222d;overflow:hidden}.sttime i{display:block;height:100%;width:100%;background:#ffb020}
.sthand{min-height:76px;font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}
.sthand.hold{filter:brightness(1.3)}
.stres{font-size:15px;line-height:1.4}`; document.head.appendChild(st); }
 ov=document.createElement('div'); ov.id='stealOv'; ov.hidden=true; (document.getElementById('app')||document.body).appendChild(ov); return ov;
}
function stealStart(iid,who){
 const inc=incById(iid); if(!inc||inc.stolen||!hasGauner(who)||gaunerCdLeft(who)) return;
 inc.stolen=true;
 Object.assign(STEAL,{on:true,inc:inc.id,who,holding:false,prog:0,st:'closed',stT:rnd(1.0,1.6),last:0,total:0,over:false,msg:'Psst. Der Patient schläft (fast).'});
 if(typeof PAUSED!=='undefined'){ STEAL.pausedBefore=PAUSED; PAUSED=true; }
 const ov=stealEnsure(); ov.hidden=false;
 ov.innerHTML=`<div class="stcard"><h3>🦹 ${esc(who)} bestiehlt den Patienten</h3>
  <div class="stface" id="stFace">😴</div><div class="stsay" id="stSay"></div>
  <div class="stbar"><i id="stProg"></i></div><div class="sttime"><i id="stTime"></i></div>
  <p class="muted" style="margin:0;font-size:12.5px">Halte den Knopf gedrückt, solange die Augen zu sind. Wenn der Patient zuckt (😳), sofort loslassen! Bei offenen Augen (👀) erwischt er dich.</p>
  <button class="btn big go sthand" id="stHand">🤏 Hand in die Jacke (halten)</button></div>`;
 const hand=document.getElementById('stHand');
 const dn=e=>{ e.preventDefault(); if(!STEAL.over) STEAL.holding=true; hand.classList.add('hold'); };
 const up=e=>{ STEAL.holding=false; hand.classList.remove('hold'); };
 hand.addEventListener('pointerdown',dn); ['pointerup','pointercancel','pointerleave'].forEach(k=>hand.addEventListener(k,up));
 hand.addEventListener('contextmenu',e=>e.preventDefault());
 STEAL.raf=requestAnimationFrame(stealLoop);
}
function stealLoop(ts){
 if(!STEAL.on||STEAL.over) return;
 const now=ts||performance.now(); const dt=STEAL.last?Math.min(.06,(now-STEAL.last)/1000):0; STEAL.last=now;
 STEAL.total+=dt; STEAL.stT-=dt;
 if(STEAL.stT<=0){
  if(STEAL.st==='closed'){ STEAL.st='warn'; STEAL.stT=.5; STEAL.msg='Er zuckt…'; }
  else if(STEAL.st==='warn'){ STEAL.st='open'; STEAL.stT=rnd(.7,1.2); STEAL.msg='Augen offen! Nicht bewegen!'; STEAL.grace=.12; }
  else { STEAL.st='closed'; STEAL.stT=rnd(.9,1.7); STEAL.msg=pick(['Zzzz…','Er schnarcht. Weiter!','Alles ruhig.','Er träumt von Maut.']); }
 }
 if(STEAL.st==='open'){ if(STEAL.holding){ STEAL.grace-=dt; if(STEAL.grace<=0) return stealEnd(false,'Der Patient hat die Hand in seiner Jacke bemerkt!'); } }
 else if(STEAL.holding){ STEAL.prog=Math.min(STEAL_NEED,STEAL.prog+dt); }
 if(STEAL.prog>=STEAL_NEED) return stealEnd(true);
 if(STEAL.total>=STEAL_LIMIT) return stealEnd(false,'Zu langsam. Der Patient wacht auf.');
 const f=document.getElementById('stFace'); if(f){ f.textContent={closed:'😴',warn:'😳',open:'👀'}[STEAL.st]; f.className='stface '+STEAL.st; }
 const s=document.getElementById('stSay'); if(s){ s.textContent=STEAL.msg; s.className='stsay '+(STEAL.st==='open'?'danger':(STEAL.st==='closed'?'safe':'')); }
 const p=document.getElementById('stProg'); if(p) p.style.width=(STEAL.prog/STEAL_NEED*100)+'%';
 const t=document.getElementById('stTime'); if(t) t.style.width=(100-STEAL.total/STEAL_LIMIT*100)+'%';
 STEAL.raf=requestAnimationFrame(stealLoop);
}
function stealEnd(ok,why){
 STEAL.over=true; STEAL.holding=false; cancelAnimationFrame(STEAL.raf);
 const inc=incById(STEAL.inc)||{id:STEAL.inc,log:[],d:{}}; const who=STEAL.who;
 const ov=document.getElementById('stealOv');
 let ab=null; if(ok) gaunerWin(who,inc); else { gaunerDie(who,inc); ab=gaunerAbort(inc,who); }
 const res=ok?`<div class="stface">🤑</div><h3>Geschafft!</h3><div class="stres">${esc(who)} hat die Geldbörse geleert.<br><b>Maut-Stand: 🪙 ${G.maut}</b></div>`

/* =====================================================================
