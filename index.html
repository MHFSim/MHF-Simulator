   ===================================================================== */
const FUEL={x:508,y:486,name:'Tankstelle Einsiedlergasse 2'};
const ZENT={x:612,y:428,name:'Zentrale'};
/* Tankdauer: 25-35 Spielminuten */
const FUEL_WARN=40;
function fuelOf(v){ return Math.max(0,Math.min(100,v.fuel===undefined?100:v.fuel)); }
function fuelCol(p){ return p>=60?'ok':(p>=FUEL_WARN?'mid':'lo'); }
/* Verbrauch je Fahrtabschnitt: insgesamt etwa 4 bis 8 % pro Einsatz, je nach Fahrzeit */
function fuelLeg(v,dur){
 const use=clamp(1.1+dur*0.25,1.3,2.7);
 const before=fuelOf(v); v.fuel=Math.max(0,before-use);
 if(before>=FUEL_WARN&&v.fuel<FUEL_WARN&&!v.fuelWarn){ v.fuelWarn=true;
  logEv('fahrzeug',`⛽ ${v.id}: Ihr Auto hat nur noch etwa ${FUEL_WARN} % Treibstoff.`);
  toast(`⛽ <b>${esc(v.id)}</b>: Ihr Auto hat nur noch etwa <b>${FUEL_WARN} % Treibstoff</b>.`,'warn'); sfx('bad'); }
}
function fuelCanSend(v){
 if(v.offT>0) return 'Das Fahrzeug ist gerade nicht einsatzbereit.';
 if(v.st==='toFuel'||v.st==='fuel'||v.st==='toZ') return 'Das Fahrzeug ist bereits beim Tanken.';
 if(v.st!=='idle') return 'Das Fahrzeug muss auf der Wache sein.';
 if(fuelOf(v)>=99.5) return 'Der Tank ist bereits voll.';
 if(!v.chip) return 'Ohne Tank-Chip geht nichts: Frag Andi danach.';
 const iss=crewIssue(v); if(iss) return v.type==='rtw'?`Besatzung mit 2 Mann nötig (${iss}).`:iss;
 if(v.type==='rtw'&&v.crew.length<2) return 'Besatzung mit 2 Mann nötig.';
 return null;
}
function fuelStaffIssue(v){
 const iss=crewIssue(v); if(iss) return v.type==='rtw'?`Besatzung mit 2 Mann nötig (${iss}).`:iss;
 if(v.type==='rtw'&&v.crew.length<2) return 'Besatzung mit 2 Mann nötig.';
 return null;
}

 if(a==='leave'){ slClose(); return; }
 if(a==='pick'){ SL.m=SLM.find(x=>x.id===d.id); SL.lines=Math.min(SL.lines,SL.m.lines.length); if(SL.m.id==='klassik') SL.lines=Math.max(1,Math.min(SL.lines,5)); SL.view='machine'; SL.win=0; SL.fsWin=0; SL.msg='Viel Glück, Spezi!'; SL.winCells=[]; SL.exp=null; SL.grid=[]; for(let r=0;r<SL.m.reels;r++){ const c=[]; for(let y=0;y<SL.m.rows;y++) c.push(slPickSym(SL.m,r)==='scat'?Object.keys(SL.m.syms)[0]:slPickSym(SL.m,r)); SL.grid.push(c); } slRender(); sfx('ok'); return; }

 else if(a==='bm') SL.bet=SL_BETS[Math.max(0,SL_BETS.indexOf(SL.bet)-1)];

 else if(a==='spin'){ slSpinGo(); return; }
 sfx('tap'); slRender();

async function slSpinGo(){

  else { SL.fs=res.fsAward; SL.fsMax=res.fsAward; SL.fsBet=bet; SL.fsLines=lines; SL.fsWin=0; SL.msg=`🎁 ${res.fsAward} FREISPIELE!`; triggered=true; }

 }
 if(free){ SL.fsWin+=total; } else { SL.win=total; }
 if(total>0){ G.maut+=total; SL.sess.net+=total; if(total>SL.sess.best) SL.sess.best=total; }
 if(!free) SL.sess.net-=tb;
 G.stats=G.stats||{}; G.stats.slSpins=(G.stats.slSpins||0)+1; G.stats.slNet=(G.stats.slNet||0)+total-(free?0:tb);

 if(total>0&&!triggered){ SL.msg=wl?`${wl} Gewinnlinie${wl>1?'n':''}${res.scatWin?` + Scatter ${res.scatWin}`:''}`:`Scatter-Gewinn ${res.scatWin}`; }

async function slAnimate(newGrid){
 const m=SL.m, cell=slSetCell(), rows=m.rows, T=SL.turbo?.5:1;

 for(let r=0;r<m.reels;r++){
  const strip=document.getElementById('sls'+r); if(!strip) continue;
  const old=SL.grid[r]||[]; const fill=[]; const n=10+r*4+(SL.turbo?0:6);
  for(let i=0;i<n;i++) fill.push(slPickSym(m,r));
  const seq=[...newGrid[r],...fill,...old];
  strip.innerHTML=seq.map(s=>slCellHTML(s)).join('');
  const total=(seq.length-rows)*cell;
  strip.style.transition='none'; strip.style.transform=`translateY(${-total}px)`;
  void strip.offsetHeight;

function autoAssign(){

function stashLoop(){
 const tick=ts=>{
  if(!M||M.type!=='andi'||M.view!=='game'||!M.game) return;
  const g=M.game; const now=ts||performance.now(); const dt=Math.min(.05,(now-(g.last||now))/1000); g.last=now;
  g.pos+=g.dir*g.spd*dt;
  if(g.pos>=100){ g.pos=100; g.dir=-1; } else if(g.pos<=0){ g.pos=0; g.dir=1; }
  const c=document.getElementById('sCur'); if(c) c.style.left=g.pos+'%';
  requestAnimationFrame(tick);
 };
 requestAnimationFrame(tick);
}

   pw.addEventListener('input',()=>{ er.hidden=true; });
 }
 /* Intro */
 let introDiff='mittel';
 const dseg=$('#introDiff');
 dseg.innerHTML=['leicht','mittel','schwer'].map(k=>`<button data-k="${k}" class="${k===introDiff?'on':''}">${DIFFS[k].name}</button>`).join('');
 dseg.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; introDiff=b.dataset.k; $$('#introDiff button').forEach(x=>x.classList.toggle('on',x===b)); });
 $('#btnStart').onclick=()=>{ ensureAudio(); sfx('go'); startNew(introDiff); };
 const lb=$('#btnLoadIntro'); lb.hidden=false;
 lb.onclick=()=>{
  const box=$('#introSlots'); box.hidden=!box.hidden;
  if(!box.hidden){
   const arr=readSlots().slice().sort((x,y)=>y.ts-x.ts);
   box.innerHTML=arr.length?arr.map(s=>`<button class="islot" data-a="introload" data-id="${esc(s.id)}">
    <span class="in">${esc(s.name)}</span>
    <span class="im">${fmtSlotTime(s.ts)} · ${esc((DIFFS[s.diff]||{}).name||'')} · ${Math.floor((s.t||0)/60)} h ${Math.floor((s.t||0)%60)} min</span>
    <span class="im">Nerven ${s.nerven} · 🪙 ${s.maut||0}</span><span class="ig">Laden ›</span></button>`).join(''):'<p class="muted" style="text-align:center">Keine Spielstände in diesem Browser gefunden. Spielstände gelten nur dort, wo sie gespeichert wurden (Seite oder heruntergeladene Datei). Du kannst unten einen Spielstand-Code einfügen.</p>';
   box.innerHTML+=`<details class="iimport"><summary>Spielstand-Code einfügen</summary><textarea id="introCode" rows="3" placeholder="Code aus System › Export einfügen"></textarea><button class="btn" data-a="introimport">Code laden</button></details>`;
  }
 };
 requestAnimationFrame(frame);
}

let lastT=performance.now(), acc=0;
function frame(now){
 const dt=Math.min(.25,(now-lastT)/1000); lastT=now;
 if(G){
  tickGame(dt);
  renderHeader();
  updateVehicles();
  if(SH.id!==null){ const inc=incById(SH.id); if(inc) updateTimer(inc); }
  acc+=dt;
  if(acc>=.25){
   acc=0;
   renderAll(); drawMarkers(false);
   if(SH.id!==null) renderSheet(false);
  }
 }
 requestAnimationFrame(frame);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();

window.__SIM={
 get G(){ return G; }, get M(){ return M; },
 newGame:startNew, spawn:spawnIncident, dispatch, answer, nextStep, openSheet, closeSheet, setTab, tickGame,
 autoAssign, onAction, doDeadClose, settle, needAviso, destOK, confirmTransport, openTransportFlow, doBelassen,
 get TF(){ return TF; }, etaOptions, hospSorted,
 fuelCanSend, fuelSend, chipGive, chipReturn, setSpeed(s){ SPEED=s; }, closeModal
};
