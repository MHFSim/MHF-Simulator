<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mariahilf SIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
 color-scheme:dark;
 --bg:#080d13; --bg2:#0d141c; --surf:#131c27; --surf2:#1a2633; --surf3:#223244; --line:#243448; --line2:#2f4660;
 --tx:#eaf0f7; --tx2:#a3b6c9; --mut:#6f879e;
 --red:#ff3b30; --red2:#c8261c; --amber:#ffb020; --green:#2ee6a6; --cyan:#4cc9f0; --viol:#b388ff; --pink:#e056fd; --gold:#ffd23f;
 --f-head:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow','Segoe UI',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--f-body);font-size:15px;line-height:1.35}
body{background:radial-gradient(1200px 600px at 50% -10%,#14233a 0%,var(--bg) 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
button:disabled{cursor:not-allowed}
h2,h3,h4{margin:0;font-family:var(--f-head);letter-spacing:.02em}
small{font-size:.78em}
p{margin:0}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#2c4058;border-radius:4px}

#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100%,520px);display:flex;flex-direction:column;background:var(--bg2);overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 80px #000a}
@media(min-width:560px){#app{top:12px;bottom:12px;border-radius:26px;box-shadow:0 0 0 1px var(--line2),0 30px 90px #000c}}

/* ---------- Header ---------- */
#top{flex:none;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top,0px)) 12px 8px;background:linear-gradient(#0e1722,#0b121a);border-bottom:1px solid var(--line)}
.clk{display:flex;flex-direction:column;align-items:flex-start;line-height:1;min-width:64px}
.clk #clkDay{font:600 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.clk #clkTime{font:700 22px var(--f-mono);letter-spacing:-.02em;color:var(--tx)}
.clk.after #clkTime{color:var(--amber)}
.clk.after #clkDay::after{content:' · Büroschluss';color:var(--amber)}
#speed{display:flex;gap:3px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:3px}
#speed button{min-width:34px;height:30px;border-radius:7px;text-align:center;font:700 12px var(--f-mono);color:var(--tx2)}
#speed button.on{background:var(--red);color:#fff}
.nerv{position:relative;flex:1;display:grid;grid-template-columns:1fr auto;grid-template-areas:'l v' 'b b';column-gap:8px;row-gap:3px;align-items:end;min-width:0}
.nlabel{grid-area:l;font:700 10px var(--f-body);letter-spacing:.16em;color:var(--mut)}
#nervVal{grid-area:v;font:700 17px var(--f-mono);line-height:1}
.nbar{grid-area:b;height:9px;border-radius:6px;background:#0a1018;border:1px solid var(--line);overflow:hidden}
#nervFill{display:block;height:100%;border-radius:6px;transition:width .5s;background:var(--green)}
#nervFill.mid{background:var(--amber)}#nervFill.lo{background:var(--red)}
.nfloat{position:absolute;right:0;top:-6px;font:700 13px var(--f-mono);animation:fl 2.1s ease-out forwards;pointer-events:none;z-index:20;text-shadow:0 1px 6px #000}
.nfloat.pos{color:var(--green)}.nfloat.neg{color:var(--red)}
@keyframes fl{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.pausetag{flex:none;height:0;overflow:visible;position:relative;z-index:12}
#pauseTag:not(:empty){position:absolute;left:50%;transform:translateX(-50%);top:4px;background:#ffb020;color:#1a1200;font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:3px 12px;border-radius:0 0 10px 10px;white-space:nowrap}

/* ---------- Tabs ---------- */
#tabs{flex:none;display:grid;grid-template-columns:repeat(6,1fr);background:#0b121a;border-top:1px solid var(--line);padding-bottom:max(2px,env(safe-area-inset-bottom,0px))}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--mut);font:600 11px var(--f-body);letter-spacing:0;min-height:54px;text-align:center}
#tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--tx)}
#tabs button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--red)}
.bd{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 10.5px/17px var(--f-mono);text-align:center;padding:0 4px}
#bdFleet{background:var(--amber);color:#1a1200}

/* ---------- Views ---------- */
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 12px 18px}
#v-map{padding:0;display:flex;flex-direction:column;overflow:hidden}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 10px;position:sticky;top:0;background:linear-gradient(var(--bg2) 75%,transparent);z-index:5}
.vhead h2{font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:12px;background:var(--surf3);border:1px solid var(--line2);font:600 14px var(--f-body);text-align:center}
.btn:hover:not(:disabled){background:#2a3f56}
.btn:disabled{opacity:.4}
.btn.go{background:linear-gradient(#26c98f,#19a974);border-color:#2ee6a6;color:#04201a;font-weight:700}
.btn.danger{background:linear-gradient(#e0392f,#b02119);border-color:#ff5a50;color:#fff;font-weight:700}
.btn.big{width:100%;min-height:52px;font-size:16px;margin-top:8px}
.btn.mini,.mini{min-height:34px;padding:5px 10px;font-size:12.5px;border-radius:9px;background:var(--surf3);border:1px solid var(--line2);font-weight:600}
.mini.warn{background:#3a2a0b;border-color:#8a6212;color:#ffd58a}
.mini small{font-family:var(--f-mono);margin-left:4px;color:var(--amber)}
.btn.more{width:100%;margin:10px 0 4px;min-height:38px;font-size:13px;color:var(--tx2)}

/* ---------- Karte ---------- */
#mapWrap{position:relative;flex:0 0 42%;min-height:210px;background:#0c131b;border-bottom:1px solid var(--line);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#map:active{cursor:grabbing}
#world .dname,#world .hname{opacity:0;transition:opacity .2s}
#world.znear .dname,#world.znear .hname{opacity:1}
#world .hname{opacity:.85}
#world.zfar .hname{opacity:0}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:11px;background:#101a25ee;border:1px solid var(--line2);text-align:center;font:600 20px var(--f-body);line-height:36px;backdrop-filter:blur(6px)}
.maplegend{position:absolute;left:10px;bottom:8px;display:flex;gap:10px;flex-wrap:wrap;font:600 10.5px var(--f-body);color:var(--tx2);background:#0b121acc;padding:4px 9px;border-radius:9px;backdrop-filter:blur(6px)}
.maplegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.mk-inc{cursor:pointer}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.5}100%{transform:scale(1.5);opacity:0}}
.mk-veh .vb{fill:#2b3d52;stroke:#8fb0d0;stroke-width:1.6}
.mk-veh.st-toScene .vb{fill:#d6291e;stroke:#ffb3ac}
.mk-veh.st-toHosp .vb{fill:#0c7da0;stroke:#a6e8ff}
.mk-veh.st-scene .vb{fill:#b57906;stroke:#ffe29a}
.mk-veh.st-cool .vb,.mk-veh.st-return .vb{fill:#1c2a39;stroke:#587393}
.mk-veh.st-toScene .vb,.mk-veh.st-toHosp .vb{animation:sirene 0.9s steps(2) infinite}
@keyframes sirene{50%{filter:brightness(1.5)}}
.mk-veh.fisu .vb{stroke:var(--gold)}
.mk-veh .vl{opacity:0}
#world.znear ~ #markers .vl{opacity:1}
#incPanel{flex:1;min-height:0;display:flex;flex-direction:column}
.panelhead{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px 6px;font:700 13px var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--tx2)}
.panelhead span{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font:700 11px/20px var(--f-mono);text-align:center;padding:0 5px}
.panelhead span:empty{display:none}
#incList{flex:1;overflow-y:auto;padding:0 12px 14px;display:flex;flex-direction:column;gap:8px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:28px 20px;color:var(--mut)}
.empty .emoji{font-size:34px;opacity:.7}.empty b{color:var(--tx2);font:700 16px var(--f-head);letter-spacing:.05em;text-transform:uppercase}
.inc{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:11px 12px 14px;background:var(--surf);border:1px solid var(--line);border-left:4px solid var(--lc);border-radius:14px;overflow:hidden;width:100%}
.inc:active{background:var(--surf2)}
.icode{display:flex;flex-direction:column;align-items:center;min-width:62px}
.icode b{font:700 20px var(--f-mono);color:var(--lc);letter-spacing:-.03em}
.icode small{font:700 10px var(--f-body);letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.imid{display:flex;flex-direction:column;min-width:0}
.iaddr{font:600 16px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idist{font-size:12px;color:var(--mut)}
.istate{margin-top:3px;font:600 12.5px var(--f-body);color:var(--tx2)}
.inc.warn .istate{color:var(--amber)}.inc.q .istate{color:var(--cyan)}.inc.tx .istate{color:var(--green)}
.inc.q{box-shadow:0 0 0 1px #4cc9f044,0 0 18px #4cc9f022}
.ibar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#0a1118}
.ibar i{display:block;height:100%;background:var(--lc);opacity:.85;transition:width .4s linear}

/* ---------- Chips / Balken ---------- */
.chip{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 7px;border-radius:6px;font:700 10.5px var(--f-mono);letter-spacing:.03em;background:#223244;color:var(--tx2);vertical-align:middle}
.chip.c-NFS{background:#0f3a30;color:var(--green)}.chip.c-NKV{background:#0d3347;color:var(--cyan)}.chip.c-NKI{background:#2c2250;color:var(--viol)}
.chip.c-NKA{background:#472027;color:#ff9aa8}.chip.c-IK{background:#443411;color:var(--gold)}.chip.c-NA{background:#3a1a1a;color:#ff8a80}.chip.c-RS{background:#252f3a;color:var(--tx2)}
.eb{flex:none;width:76px;height:7px;border-radius:5px;background:#0a1018;border:1px solid var(--line);overflow:hidden}
.eb i{display:block;height:100%;border-radius:5px;background:var(--green)}.eb i.mid{background:var(--amber)}.eb i.lo{background:var(--red)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--f-head);letter-spacing:.04em;background:#20303f;color:var(--tx2);border:2px solid #2e4358}
.av.c-NFS{border-color:#1f8f6d;color:var(--green)}.av.c-NKV{border-color:#2290b3;color:var(--cyan)}.av.c-NKI{border-color:#7a58d6;color:var(--viol)}.av.c-NKA{border-color:#b84a5d;color:#ff9aa8}.av.c-IK{border-color:#b8921f;color:var(--gold)}
.sflag{flex:none;font:700 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:7px;background:#223244;color:var(--tx2)}
.sflag.neb,.sflag.arrest{background:#4a1a1a;color:#ff8a80}.sflag.tired{background:#47300c;color:var(--amber)}.sflag.ok{background:#0f3a30;color:var(--green)}.sflag.busy{background:#0d3347;color:var(--cyan)}
.red{color:#ff6b61}.amber{color:var(--amber)}.muted{color:var(--mut);font-size:13px}

/* ---------- Fuhrpark ---------- */
.banner{margin:2px 0 12px;padding:12px 14px;background:linear-gradient(135deg,#3a1114,#1f1014);border:1px solid #7a2a2f;border-radius:14px;color:#ffc9c4;font-size:14px}
.banner b{display:block;font:700 15px var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:#ff8a80;margin-bottom:2px}
.vc{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:11px}
.vc.issue{border-color:#8a5a12}
.vc.st-toScene{border-color:#a33}.vc.st-toHosp{border-color:#1d7fa0}.vc.st-scene{border-color:#a07412}
.vh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.vname{font:700 24px var(--f-head);letter-spacing:.04em}
.vtype{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.vstate{margin-left:auto;font:700 11.5px var(--f-body);padding:4px 10px;border-radius:9px;background:#223244;color:var(--tx2)}
.vstate.ok{background:#0f3a30;color:var(--green)}.vstate.bad{background:#47300c;color:var(--amber)}.vstate.go{background:#4a1a1a;color:#ff8a80}.vstate.busy{background:#47300c;color:var(--amber)}.vstate.tx{background:#0d3347;color:var(--cyan)}
.slots{display:grid;grid-template-columns:1fr;gap:7px}
.slot{display:flex;align-items:center;gap:10px;min-height:56px;padding:7px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;flex-wrap:wrap}
.slot .sn{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:3px 7px}
.slot .sn b{font:700 17px var(--f-head);letter-spacing:.03em}
.hint{color:var(--mut);font-size:11px;width:100%}
.slot.empty{border-style:dashed;color:var(--mut);justify-content:center;gap:8px}
.slot.empty .plus{width:30px;height:30px;border-radius:50%;background:var(--surf3);display:grid;place-items:center;font:700 20px var(--f-body);color:var(--tx)}
.slot.neb,.slot.arrest{border-color:#7a2a2f;background:#1f1215}
.slot.tired{border-color:#8a5a12}
.cdbar{height:5px;background:#0a1118;border-radius:3px;margin-top:9px;overflow:hidden}.cdbar i{display:block;height:100%;background:var(--cyan)}
.vf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.pen{font:700 11.5px var(--f-body);padding:4px 9px;border-radius:8px}.pen.ok{background:#0f3a30;color:var(--green)}.pen.no{background:#47300c;color:var(--amber)}
.hintline{font-size:12.5px;color:var(--mut)}

/* ---------- Besatzung ---------- */
.andi{background:linear-gradient(135deg,#2a2210,#161b24);border:1px solid #6b5518;border-radius:18px;padding:12px;margin:2px 0 12px}
.arow{display:flex;gap:10px;align-items:center}.atxt b{font:700 20px var(--f-head);margin-right:8px}.atxt small{display:block;color:var(--tx2);margin-top:1px}
.anerv{display:flex;align-items:center;gap:10px;margin:10px 0 6px}.nb{flex:1;height:12px;border-radius:7px;background:#0a1018;border:1px solid #3a3118;overflow:hidden}.nb i{display:block;height:100%;background:var(--green)}.nb i.mid{background:var(--amber)}.nb i.lo{background:var(--red)}.nv{font:700 18px var(--f-mono);min-width:34px;text-align:right}
.arule{font-size:13px;color:var(--tx2)}
.crow{display:flex;gap:11px;padding:11px 12px;margin-bottom:8px;background:var(--surf);border:1px solid var(--line);border-radius:15px}
.crow.neb,.crow.arrest{border-color:#7a2a2f;background:#1c1316}
.cmain{flex:1;min-width:0}.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ctop b{font:700 19px var(--f-head);letter-spacing:.03em}.ctop .sflag{margin-left:auto}
.cmid{display:flex;align-items:center;gap:8px;margin:6px 0 5px}.cmid .eb{flex:1;width:auto;height:9px}.en{font:600 12px var(--f-mono);color:var(--tx2);min-width:36px;text-align:right}
.cbot{display:flex;gap:14px;font-size:12.5px;color:var(--tx2)}.cbot b{font-family:var(--f-mono)}
.cnote{margin-top:5px;font-size:12px;color:var(--mut)}

/* ---------- System ---------- */
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px}
.card h3{font-size:18px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx2);margin-bottom:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.btnrow .btn{flex:1;min-width:120px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:8px}
.seg button{min-height:40px;border-radius:9px;text-align:center;font-weight:700;color:var(--tx2)}.seg button.on{background:var(--red);color:#fff}
.toggle{display:flex;gap:10px;align-items:center;margin-top:8px;min-height:36px}.toggle input{width:20px;height:20px;accent-color:var(--red)}
textarea{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--line2);border-radius:10px;padding:8px;font:12px var(--f-mono);resize:vertical;margin:8px 0}
details summary{cursor:pointer;color:var(--tx2);font-weight:600;min-height:34px;display:flex;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.stats div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}.stats b{display:block;font:700 22px var(--f-mono)}.stats span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.ver{text-align:center;color:var(--mut);font-size:13px}

/* ---------- Einsatz-Sheet ---------- */
#sheet{position:absolute;inset:0;z-index:40;background:var(--bg2);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheethead{flex:none;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top,0px)) 12px 10px 6px;background:linear-gradient(#101b27,#0c131b);border-bottom:1px solid var(--line)}
.back{width:42px;height:46px;font:300 38px/42px var(--f-body);color:var(--tx2);text-align:center}
.hm{flex:1;min-width:0;border-left:4px solid var(--lc);padding-left:11px}
.h1{display:flex;align-items:baseline;gap:10px}.ccode{font:700 25px var(--f-mono);color:var(--lc);letter-spacing:-.03em}.clevel{font:700 12px var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--tx2)}
.h2{font:600 16px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.h3{font-size:12.5px;color:var(--mut)}
.vtag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:#223244;color:var(--tx);font:700 10.5px var(--f-mono)}.vtag.s-scene{background:#47300c;color:var(--amber)}.vtag.s-toHosp{background:#0d3347;color:var(--cyan)}.vtag.s-toScene{background:#4a1a1a;color:#ff8a80}
#sheetBody{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 14px}
#sheetFoot{flex:none;max-height:62%;overflow-y:auto;background:linear-gradient(#0e1620,#0b121a);border-top:1px solid var(--line2);padding:0 12px max(12px,env(safe-area-inset-bottom,0px))}
#sheetFoot:empty{display:none}
.unknown{padding:16px;border:1px dashed var(--line2);border-radius:14px;color:var(--tx2);margin-bottom:12px}.unknown b{display:block;font:700 17px var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.monitor{background:#07101a;border:1px solid #1d3a52;border-radius:15px;padding:10px 11px;margin-bottom:12px;box-shadow:inset 0 0 28px #4cc9f00d}
.monitor .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--mut)}.monitor .mhead b{font:700 13px var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vit{background:#0b1824;border-radius:9px;padding:5px 7px}.vit small{display:block;font:600 9.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.vit b{font:700 14.5px var(--f-mono);color:#7fe6c0;white-space:nowrap}.vit.warn b{color:#ff6b61}

/* ---------- 14  Lumbago (Penthrop) ---------- */
Q({id:'lumbago',g:'r',age:[28,52],w:4,make:P=>{

 return {
 code:'05A01',label:'Rückenschmerzen',reversOK:1,
 story:`${P.pat} (${P.age}) liegt verkrümmt auf der Wohnzimmercouch. „Ich hab nur den Wäschekorb gehoben, und dann hat es geknackt.“ Der Schmerz sitzt im unteren Rücken, jede Bewegung treibt Tränen in die Augen. ${preg?'Nebenbei erwähnt '+P.er+': „Ich bin im vierten Monat schwanger.“':'Taubheit, Fieber oder Inkontinenz gibt es nicht.'}`,
 vit:{spo2:98,hr:98,bp:'132/84',af:18,gcs:15,temp:36.7,bz:99},
 steps:[
  ST('Wie beurteilst du den Rückenschmerz (NRS 8)?',[
   o('Red Flags abfragen (Taubheit, Lähmung, Inkontinenz, Fieber), Lagerung nach Wunsch, Vitalwerte',1,'NFS','Richtig: Ausschluss gefährlicher Ursachen vor der Analgesie.',{res:'Keine Red Flags. Schmerz NRS 8, Atmung unauffällig.'}),
   o('Sofort in den RTW tragen, die Analgesie macht die Klinik',0,'NFS','Bei NRS ≥ 4 gehört die Analgesie nach ED-P29 zur Versorgung durch NFS.')
  ],'ED-P29'),
  ST('Welche Analgesie wählst du?',[
   o('Methoxyfluran (Penthrop) 3 ml inhalativ, selbstlimitierend',!preg,'NFS',preg?'Falsch: Methoxyfluran ist in der Schwangerschaft kontraindiziert!':'Richtig: Methoxyfluran bei akutem Lumbago (≥ 6 Jahre). Der Inhaler muss danach bei Andi nachgeholt werden.',{med:'penthrop',crit:preg?1:0,res:'Nach 6–10 Atemzügen lässt der Schmerz deutlich nach.'}),
   o('Paracetamol 15 mg/kgKG i.v. (max. 1.000 mg)',1,'NKV','Richtig: Paracetamol bei atraumatischem Schmerz.',{med:1,best:preg?1:0}),
   o('Esketamin 0,5 mg/kgKG intranasal',!preg,'NFS',preg?'In der Schwangerschaft kontraindiziert.':'Möglich als Alternative statt Methoxyfluran (nicht bei Koliken), erfordert verpflichtendes Monitoring.',{med:1,crit:preg?1:0}),
   NA('Morphin 5 mg i.v.','Morphin ist Telemedizin-Liste.')
  ],'ED-P29')
 ],

 dest:{ok:['INT','UNF']}};
}});

/* ---------- 16  Oberschenkelhalsfraktur ---------- */

 vit:{spo2:95,hr:92,bp:'112/68',af:18,gcs:15,temp:36.2,bz:122},
 steps:[
  ST('Wie klärst du das Sturzgeschehen (GEMS/SPLATT)?',[

   ...dOpts([Math.round(em/2),em,em*2],em,v=>`Esketamin ${v} mg intranasal`,'NFS',`Richtig: 0,5 mg/kgKG = ${em} mg intranasal, nach 5 Min. einmal wiederholbar.`,v=>`Falsch dosiert: bei ${kg} kgKG sind ${em} mg (0,5 mg/kgKG) vorgesehen.`,{med:1}),

/* ---------- 17  Kind Unterarmfraktur (Penthrop ab 6 J.) ---------- */

 vit:{spo2:99,hr:124,bp:'98/60',af:24,gcs:15,temp:36.8,bz:92},
 steps:[

   o('Zuerst alle Kinder wegschicken, dann am Arm ziehen',0,'NFS','Ruhig vorgehen, Bezugsperson einbinden, nicht am Arm ziehen.',{crit:1})

   o('Paracetamol 15 mg/kgKG i.v.',1,'NKV','Richtig: Paracetamol 15 mg/kgKG.',{med:1}),

  ST('Wie versorgst du die Fraktur?',[

   o('Repositionsversuch am Handgelenk vor Ort',0,'NFS','Am Handgelenk gibt es keinen Repositionsversuch (ED-P27).',{crit:1}),

   o('Den Mund mit dem Spatel inspizieren',0,'NFS','Manipulation im Rachen kann einen Laryngospasmus auslösen.',{crit:1}),

  ST('Wie geht es weiter?',[

 let len=0; for(let i=1;i<pts.length;i++) len+=Math.abs(pts[i].x-pts[i-1].x)+Math.abs(pts[i].y-pts[i-1].y);
 const ex=extra||0;
 v.trip={pts,len,ex,dur:Math.max(1.5,len/VSPEED)+ex,el:0,to:{x:to.x,y:to.y}};
}
function tripPos(T,f){
 let d=f*T.len;
 for(let i=1;i<T.pts.length;i++){
  const a=T.pts[i-1],b=T.pts[i]; const sl=Math.abs(b.x-a.x)+Math.abs(b.y-a.y);
  if(d<=sl||i===T.pts.length-1){ const k=sl>0?clamp(d/sl,0,1):1; return {x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k}; }
  d-=sl;
 }
 return {x:T.to.x,y:T.to.y};
}
function stepTrip(v,dt){
 const T=v.trip; T.el+=dt;
 const f=T.dur-T.ex>0?clamp((T.el-T.ex)/(T.dur-T.ex),0,1):1;
 const p=tripPos(T,f); v.x=p.x; v.y=p.y;
 return T.el>=T.dur;
}
function etaMin(v,pos){
 const len=Math.abs(v.x-pos.x)+Math.abs(v.y-pos.y);
 return Math.max(1.5,len/VSPEED)+(v.dolm?1:0);
}

/* ---------- Spawn ---------- */
function makeP(g,age){
 const f=g==='f'; const sur=pick(SURNAMES);
 return {g,age,pat:(f?'Frau ':'Herr ')+sur,kidname:(f?pick(FIRSTF):pick(FIRSTM))+' '+sur,
  er:f?'sie':'er',Er:f?'Sie':'Er',Der:f?'Die Patientin':'Der Patient',ihn:f?'sie':'ihn',ihm:f?'ihr':'ihm',
  sein:f?'ihrem':'seinem',seine:f?'ihre':'seine',Seine:f?'Ihre':'Seine',dem:f?'der':'dem',pick};
}
function weightFor(q){
 let w=q.w||1;
 if(q.tod){ const h=hourOf(); const hh=(h<q.tod[0]&&q.tod[1]>24)?h+24:h; if(hh>=q.tod[0]&&hh<q.tod[1]) w*=q.tod[2]; else w*=0.45; }
 if(G.lastQ.includes(q.id)) w*=0.25;
 return w;
}
function pickQuest(){
 let pool=QUESTS;
 if(G.spawned<2) pool=QUESTS.filter(q=>EASY_FIRST.includes(q.id));
 const ws=pool.map(weightFor); let r=Math.random()*ws.reduce((a,b)=>a+b,0);
 for(let i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0) return pool[i]; }
 return pool[0];
}
function pickDistrict(q){
 if(QDIST[q.id]) return DISTRICTS.find(d=>d.n===pick(QDIST[q.id]));
 let tot=0; DISTRICTS.forEach(d=>tot+=DIST_W[d.n]); let r=Math.random()*tot;
 for(const d of DISTRICTS){ r-=DIST_W[d.n]; if(r<=0) return d; }
 return DISTRICTS[0];
}
function spawnIncident(forceId){
 const q=forceId?QUESTS.find(x=>x.id===forceId):pickQuest();
 const g=q.g==='f'?'f':(q.g==='m'?'m':(Math.random()<.5?'m':'f'));
 const age=rnd(q.age[0],q.age[1]);
 const P=makeP(g,age);
 const d=q.make(P);
 const dist=pickDistrict(q);
 const street=QSTREET[q.id]||pick(dist.streets);
 const no=rnd(1,118);

 const inc={id:G.nid++,qid:q.id,d,st:'alarm',born:G.t,
  addr:`${street} ${no}`,plz:'1'+String(dist.n).padStart(2,'0')+'0',dist:dist.n,distName:dist.name,x,y,
  code:d.code,label:d.label,lvl:d.code[2]||'C',step:0,vehs:[],log:[],err:0,crit:0,meds:[],pen:false,sets:{},best:0,
  cur:null,tx:null,age,g,sceneT:null,seen:false,okSteps:0,comp:0,ev:0};
 G.inc.push(inc); G.spawned++;
 G.lastQ.push(q.id); if(G.lastQ.length>3) G.lastQ.shift();
 toast(`<b>${inc.code}</b> · ${inc.addr}, ${inc.plz} Wien`,'alarm',inc.id);

/* ---------- Fragen ---------- */
function visibleOpts(inc,step){
 const rank=sceneRank(inc);
 const lim=DIFFS[G.diff].opts;
 const pv=penVeh(inc);
 let av=[];
 step.opts.forEach((op,idx)=>{
  const need=op.c==='NA'?0:(RANK[op.c]!==undefined?RANK[op.c]:1);
  if(need>rank) return;
  av.push({idx,lock:(op.med==='penthrop'&&!pv)?'Penthrop leer – bei Andi nachholen':null});
 });
 if(av.length>lim){
  const oks=av.filter(a=>step.opts[a.idx].ok&&!a.lock), bad=shuffle(av.filter(a=>!step.opts[a.idx].ok));
  const best=oks.find(a=>step.opts[a.idx].best);
  const keep=[best||shuffle(oks)[0]].filter(Boolean);
  if(Math.random()<.35&&oks.length>1){ const o2=shuffle(oks).find(a=>a!==keep[0]); if(o2) keep.push(o2); }
  for(const b of bad){ if(keep.length>=lim) break; keep.push(b); }
  av=keep;
 }
 return shuffle(av);
}
function beginStep(inc){
 const st=inc.d.steps[inc.step];
 if(!st){ finishSteps(inc); return; }
 const list=visibleOpts(inc,st);
 let tmax=DIFFS[G.diff].qTime;
 const lowE=sceneVehs(inc).some(v=>v.crew.some(n=>G.crew[n].en<50));
 if(lowE) tmax*=.75;
 inc.cur={i:inc.step,list,sel:-1,tleft:tmax,tmax,done:false,timeout:false};
}
function finishSteps(inc){
 inc.cur=null;
 if(inc.d.dead){ inc.st='decide'; inc.log.push({t:G.t,k:'info',x:'Todesfeststellung abgeschlossen. Dokumentation und Verständigung sind erledigt.'}); return; }
 inc.st='decide';
 inc.log.push({t:G.t,k:'info',x:'Erstversorgung abgeschlossen. Entscheidung: Patient belassen (Revers) oder Transport?'});
}
function drainCrew(inc,amt){
 sceneVehs(inc).forEach(v=>v.crew.forEach(n=>{ G.crew[n].en=Math.max(0,G.crew[n].en-amt); }));
}
function complication(inc){
 inc.log.push({t:G.t,k:'event',x:pick(COMPL)});
 drainCrew(inc,5);
}
function answer(iid,k){
 const inc=incById(iid); if(!inc||!inc.cur||inc.cur.done) return;
 const cur=inc.cur, st=inc.d.steps[cur.i], item=cur.list[k]; if(!item||item.lock) return;
 const op=st.opts[item.idx];
 cur.sel=k; cur.done=true;
 if(op.med){ inc.meds.push(op.med); }
 if(op.med==='penthrop'){ const pv=penVeh(inc); if(pv&&pv.type!=='nef'){ pv.pen=false; } inc.pen=true; }
 if(op.sets) Object.assign(inc.sets,op.sets);
 if(op.ok){
  inc.okSteps++; if(op.best) inc.best++;
  inc.log.push({t:G.t,k:'ok',x:`<b>✔ ${esc(op.t)}</b>`,sub:op.res||op.fb});
 } else {
  inc.err++; drainCrew(inc,3);
  inc.log.push({t:G.t,k:op.crit?'crit':'bad',x:`<b>✘ ${esc(op.t)}</b>`,sub:op.fb});
  if(op.crit){ inc.crit++; addNerven(-2,'Kritischer Fehler'); drainCrew(inc,5); complication(inc); }
  else if(Math.random()<.35) complication(inc);
 }
 /* Zufallsereignis */
 if(Math.random()<DIFFS[G.diff].ev){ inc.log.push({t:G.t,k:'event',x:pick(EVENTS)}); drainCrew(inc,2); inc.ev++; }
 sfx(op.ok?'ok':'bad');
}
function nextStep(iid){
 const inc=incById(iid); if(!inc||!inc.cur||!inc.cur.done) return;
 inc.step++; beginStep(inc);
}
function timeoutStep(inc){
 const cur=inc.cur; if(!cur||cur.done) return;
 cur.done=true; cur.sel=-2; cur.timeout=true;
 inc.err++; drainCrew(inc,3);
 inc.log.push({t:G.t,k:'bad',x:'<b>⏱ Keine Entscheidung rechtzeitig getroffen.</b>',sub:'Die Zeit ist abgelaufen. Das zählt als Fehler.'});
 complication(inc);
 sfx('bad');
}

function needAviso(inc){
 const d=inc.d, v=d.vit, f=d.flags||{}, why=[];
 if(f.stemi) why.push('STEMI/NSTEMI zur PCI (ED-P17/P20)');
 if(f.stroke) why.push('Verdacht auf Schlaganfall/TIA/ICB (ED-P22/P25)');
 if(d.bit) why.push('Bariatrischer Patient, nur mit BIT transportierbar');
 if(d.trauma&&d.tr&&d.tr.length) why.push('Traumakriterium: '+d.tr[0]);
 if(f.airway) why.push('A: (drohende) Atemwegsverlegung');
 if(v.spo2>0&&v.spo2<=85) why.push('B: SpO₂ ≤ 85 % unter Raumluft');
 if(v.af>0&&v.af<=6) why.push('B: Atemfrequenz ≤ 6/min');
 if(v.af>=30) why.push('B: Atemfrequenz ≥ 30/min');
 if(inc.sets.niv) why.push('B: NIV begonnen');
 if(f.exhaust) why.push('B: drohende respiratorische Erschöpfung');
 if(f.inhal) why.push('B: Inhalationstrauma');
 const sbp=parseInt(String(v.bp).split('/')[0],10);
 if(!isNaN(sbp)&&sbp>0&&sbp<80) why.push('C: systolischer RR < 80 mmHg');
 if(v.hr>0&&v.hr<=40) why.push('C: Herzfrequenz ≤ 40/min');
 if(v.hr>=180) why.push('C: Herzfrequenz ≥ 180/min');
 if(d.cpr) why.push('C: Reanimation / ROSC');
 if(inc.sets.kat) why.push('C: Katecholamin (Epinephrin) eingesetzt');
 if(v.gcs>0&&v.gcs<=9) why.push('D: GCS ≤ 9');
 if(f.statusEpi) why.push('D: Status epilepticus');
 if(f.noProtect) why.push('D: fehlende Schutzreflexe');
 if(f.neuroDef) why.push('D: akutes neurologisches Defizit / Meningitis');
 if(v.temp>0&&v.temp<=32) why.push('E: Hypothermie ≤ 32 °C');
 if(v.temp>=40) why.push('E: Hyperthermie ≥ 40 °C');
 if(f.sepsis) why.push('E: qSOFA ≥ 2 / Sepsisverdacht');
 if(f.metab) why.push('E: schwere metabolische Störung');
 if(d.aviso===true&&!why.length) why.push(d.cpr?'Reanimation':'Sonderfall laut SOP: Aviso Zielabteilung');
 if(d.aviso===false) return {need:false,why:[]};
 return {need:why.length>0,why};
}

function pciOK(hid,inc,day,hour){
 const rule=pciRule(day,hour);
 const h=HMAP[hid]; if(!h.svc.includes('PCI')) return {ok:false,why:`${h.name} hat kein Herzkatheter-Labor.`};
 if(rule.mode==='fix'){
  const ok=hid===rule.h||hid==='AKH';
  return {ok,why:ok?'':`PCI-Zentrum nach Dienstplan: ${HMAP[rule.h].name} (${rule.txt}).`};
 }
 const pcis=HOSPITALS.filter(x=>x.svc.includes('PCI')).map(x=>({id:x.id,m:driveMin(inc,x)})).sort((a,b)=>a.m-b.m);
 const ok=hid===pcis[0].id||hid==='KFL'||driveMin(inc,HMAP[hid])<=pcis[0].m+1;
 return {ok,why:ok?'':`Mo–Fr 08–13 Uhr gilt das nächstgelegene PCI-Zentrum: ${HMAP[pcis[0].id].name}.`};
}
function destOK(inc,hid,day,hour){
 const h=HMAP[hid], dd=inc.d.dest;
 if(!dd) return {ok:true,why:''};
 if(dd.special==='PCI') return pciOK(hid,inc,day,hour);
 if(dd.special==='FRUEH'){
  const ok=fruehOK(hid,inc.d.ssw,inc.d.twins);
  return {ok,why:ok?'':`Für die ${inc.d.ssw}. SSW${inc.d.twins?' (Zwillinge)':''} ist ${h.name} laut Frühgeburten-Tabelle nicht zuständig.`};
 }
 if(dd.special==='VAD'){ const ok=hid==='AKH'; return {ok,why:ok?'':'VAD-Patienten gehören ins VAD-Zentrum (AKH Wien).'}; }
 const hit=dd.ok.some(t=>h.svc.includes(t));
 if(!hit) return {ok:false,why:`${h.name} bietet nicht: ${dd.ok.map(t=>AMBS[t].n).join(' / ')}.`};
 if(dd.special==='STU'&&!h.svc.includes('STU')) return {ok:false,why:`${h.name} hat keine Stroke Unit.`};
 return {ok:true,why:''};
}

}

 let fail=false, delta=0, hioNeeded=false;

/* ---------- Speichern ---------- */
const SLOTS_KEY='mariahilf-sim-2026-slots-v1';
const MAX_SLOTS=10;
function readSlots(){
 try{
  let arr=JSON.parse(localStorage.getItem(SLOTS_KEY)||'null');
  if(!Array.isArray(arr)){
   arr=[];
   const old=localStorage.getItem(SAVE_KEY);
   if(old){ try{ const o=JSON.parse(old); arr.push({id:'s'+Date.now(),name:'Alter Spielstand',ts:Date.now(),diff:o.diff,t:o.t,nerven:o.nerven,maut:o.maut||0,data:old}); localStorage.setItem(SLOTS_KEY,JSON.stringify(arr)); }catch(e){} }
  }
  return arr;
 }catch(e){ return []; }
}
function writeSlots(arr){ try{ localStorage.setItem(SLOTS_KEY,JSON.stringify(arr)); return true; }catch(e){ return false; } }
function hasSave(){ return readSlots().length>0; }
function slotMeta(){ return {ts:Date.now(),diff:G.diff,t:G.t,nerven:Math.round(G.nerven),maut:G.maut}; }
/* id leer: neuer Spielstand. id gesetzt: überschreiben (Name bleibt) */
function saveToSlot(id,name){
 const arr=readSlots();
 let slot=id?arr.find(x=>x.id===id):null;
 if(!slot){
  if(arr.length>=MAX_SLOTS) return {ok:false,why:'full'};
  slot={id:'s'+Date.now()+Math.floor(Math.random()*999),name:name||('Spielstand '+(arr.length+1))};
  arr.unshift(slot);
 }
 G.slot=slot.id; G.slotName=slot.name; G.savedT=G.t;
 Object.assign(slot,slotMeta(),{data:JSON.stringify(G)});
 if(!writeSlots(arr)) return {ok:false,why:'storage'};
 return {ok:true,slot};
}
function loadSlot(id){
 const slot=readSlots().find(x=>x.id===id); if(!slot) return false;
 try{ const o=JSON.parse(slot.data); if(!o||!o.crew) return false; G=o; G.slot=slot.id; G.slotName=slot.name; G.savedT=G.t; migrate(); G.endShown=false; return true; }catch(e){ return false; }
}
function deleteSlot(id){ const arr=readSlots().filter(x=>x.id!==id); if(G&&G.slot===id){ G.slot=null; G.slotName=null; } return writeSlots(arr); }
function renameSlot(id,name){
 name=(name||'').trim().slice(0,32); if(!name) return false;
 const arr=readSlots(); const s=arr.find(x=>x.id===id); if(!s) return false;
 s.name=name; if(G&&G.slot===id) G.slotName=name;
 return writeSlots(arr);
}
/* Kompatibilität: Schnellspeichern / letzten Stand laden */
function saveGame(){ const r=saveToSlot(G&&G.slot?G.slot:null); return r.ok; }
function loadGame(){ const arr=readSlots(); if(!arr.length) return false; const s=arr.slice().sort((a,b)=>b.ts-a.ts)[0]; return loadSlot(s.id); }
function migrate(){

}

  return {txt:`Unbesetzt · noch ${Math.ceil(left)} Min`,cls:'warn',pct:left/lim};
 }
 if(inc.st==='enroute'){
  let best=null; inc.vehs.map(vehById).forEach(v=>{ if(v&&v.st==='toScene'&&v.trip){ const r=v.trip.dur-v.trip.el; if(best===null||r<best.r) best={r,v}; } });
  return {txt:best?`Anfahrt ${best.v.id} · Ankunft ${hhmm(G.t+best.r)}`:'Anfahrt',cls:'info',pct:best?clamp(1-best.r/Math.max(1,best.v.trip.dur),0,1):0};
 }
 if(inc.st==='scene'){
  const c=inc.cur;
  if(c&&!c.done) return {txt:`Frage ${c.i+1}/${inc.d.steps.length} · ${Math.ceil(c.tleft)} s`,cls:'q',pct:c.tleft/c.tmax};
  if(c&&c.done) return {txt:'Antwort auswerten',cls:'q',pct:1};
  return {txt:'Vor Ort',cls:'info',pct:1};
 }
 if(inc.st==='decide') return {txt:inc.d.dead?'Einsatz abschließen':'Entscheidung offen',cls:'q',pct:1};
 if(inc.st==='needrtw') return {txt:'RTW nachfordern!',cls:'warn',pct:1};
 if(inc.st==='transport'){

 }
 return {txt:'',cls:'',pct:0};
}

/* ---------- Besatzung ---------- */
function crewStatusBars(n){
 const c=G.crew[n]; let h='';
 const bs=buffsOf(n);
 if(bs.length){
  const risk=1-bs.reduce((a,b)=>a*(1-DRUGS.find(x=>x.id===b.drug).od),1);
  const pct=Math.round(risk*100);
  const names=bs.map(b=>DRUGS.find(x=>x.id===b.drug).n).join(', ');
  h+=`<div class="cstat drug"><div class="csl"><b>⚠ Unter Einfluss: ${esc(names)}</b><small>${pct?'Überdosis-Risiko '+pct+' %':'kein Überdosis-Risiko'}</small></div><div class="cbar red"><i style="width:${pct}%"></i></div></div>`;

 if(f>0) h+=`<div class="cstat food"><div class="csl"><b>🍔 Bauch</b><small>${f>=95?'pappsatt':f+' % satt'}</small></div><div class="cbar green"><i style="width:${f}%"></i></div></div>`;
 return h;
}

 let h=`<div class="vitals">`;
 h+=cell('SpO₂',v.spo2?v.spo2+' %':'—',v.spo2&&v.spo2<=90);
 h+=cell('HF',v.hr?v.hr+'/min':'—',v.hr&&(v.hr>=130||v.hr<=45));
 h+=cell('RR',v.bp,!isNaN(sbp)&&(sbp<90||sbp>180));
 h+=cell('AF',v.af?v.af+'/min':'—',v.af&&(v.af>=28||v.af<=8));
 h+=cell('GCS',v.gcs,v.gcs<=12);

(function(){

function doAssign(v,n,i){
 const old=assignedTo(n);
 if(old&&old!==v&&old.st!=='idle'){ toast(`${n} ist gerade auf ${old.id} im Einsatz.`,'warn'); return false; }
 const occ=v.crew[i];
 unassign(n);
 if(occ&&occ!==n){ v.crew=v.crew.filter(x=>x!==occ); if(occ==='Denis') v.dolm=false; }
 v.crew.push(n);
 checkStart();
 return true;
}

function autoAssign(){
 const done=[];
 VEH_DEF.forEach(d=>{
  if(d.type==='nef') return;
  const v=vehById(d.id); if(v.st!=='idle') return;
  const blocked=d.def.some(m=>{ const o=assignedTo(m); return o&&o!==v&&o.st!=='idle'; });
  if(blocked) return;
  d.def.forEach(m=>unassign(m));
  v.crew=d.def.filter(m=>G.crew[m].st!=='dead'); v.dolm=false; done.push(v);
 });
 if(!done.length){ toast('Kein Fahrzeug auf der Wache konnte zugeordnet werden.','warn'); return; }
 toast(`${done.length} Fahrzeug${done.length>1?'e':''} besetzt.`,'info');
 const den=done.find(v=>v.crew.includes('Denis')), ber=done.find(v=>v.crew.includes('Berni'));
 if(den) QUEUE.push(()=>confirmModal('Denis','Denis spricht nur gebrochen Deutsch, soll ein Dolmetscher mit aufs Auto gegeben werden?',
   [{t:'Ja, Dolmetscher mitgeben',cls:'go',fn:()=>{ den.dolm=true; renderAll(); }},{t:'Nein, das geht schon',fn:()=>{ den.dolm=false; }}]));

 checkStart(); renderAll(); runQueue();
}

function stashLoop(){
 const tick=ts=>{
  if(!M||M.type!=='andi'||M.view!=='game'||!M.game) return;
  const g=M.game; const now=ts||performance.now(); const dt=Math.min(.05,(now-(g.last||now))/1000); g.last=now;
  g.pos+=g.dir*g.spd*dt;
  if(g.pos>=100){ g.pos=100; g.dir=-1; } else if(g.pos<=0){ g.pos=0; g.dir=1; }
  const c=document.getElementById('sCur'); if(c) c.style.left=g.pos+'%';
  requestAnimationFrame(tick);
 };
 requestAnimationFrame(tick);
}
function onAction(a,el){
 const d=el.dataset;
 const inc=SH.id!==null?incById(SH.id):null;
 switch(a){
  case 'tab': setTab(d.t); sfx('tap'); break;
  case 'openInc': openSheet(+d.id); if(TAB!=='map'&&false) setTab('map'); break;
  case 'closeSheet': closeSheet(); break;
  case 'more': SH.more=!SH.more; renderSheet(true); break;
  case 'disp': {
   if(!inc) break;
   const go=()=>{ if(dispatch(d.v,inc.id)){ sfx('go'); renderSheet(true); renderAll(); } };
   if(d.v==='NA Hubsi'&&canDispatch(vehById('NA Hubsi'))===null&&['alarm','enroute','scene','needrtw'].includes(inc.st)){
    confirmModal('🚑 NA + Hubsi','<i>Hubsi:</i> „Und wos genau moch i jetzt do?“',[{t:'Ab geht’s',cls:'go',fn:go}]);
   } else go();
   break; }
  case 'ans': answer(SH.id,+d.k); renderSheet(true); renderAll(); break;
  case 'next': nextStep(SH.id); renderSheet(true); renderAll(); break;
  case 'tx':
   if(!inc) break;
   if(!rtwOnScene(inc)){
    const sp=specOnScene(inc), who=sp&&sp.type==='nef'?'Der Notarzt':'Roni';
    confirmModal(`${who} transportiert nicht`,`${sp&&sp.type==='nef'?'Ein Notarzt-Einsatzwagen führt keine Abtransporte durch.':'Als Offizier führt Roni keine eigenen Abtransporte durch.'} Es wird ein freier RTW nachgefordert, der den Patienten übernimmt.`,
     [{t:'RTW nachfordern',cls:'go',fn:()=>{ inc.st='needrtw'; inc.log.push({t:G.t,k:'info',x:`${who} fordert einen RTW für den Transport nach.`}); SH.more=false; renderSheet(true); renderAll(); }},{t:'Abbrechen'}]);
   } else openTransportFlow(inc.id);
   break;
  case 'bel':
   if(!inc) break;
   confirmModal('Patient belassen?',fisuOnScene(inc)?`Der Patient lehnt weitere Versorgung ab. ${specOnScene(inc).type==='nef'?'Der Notarzt entscheidet vor Ort':'Als Offizier entscheidet Roni'}, es gibt keine Konsequenzen.`:'Der Patient lehnt den Transport ab und unterschreibt den Revers. Wenn es schiefgeht, droht ein HIO-Verhör.',
    [{t:'Ja, belassen',cls:'danger',fn:()=>{ doBelassen(inc.id); }},{t:'Abbrechen'}]);
   break;
  case 'deadclose': if(inc) doDeadClose(inc.id); break;
  /* Transport-Flow */
  case 'tfaviso': TF.aviso=d.k==='1'; TF.stage=1; renderModal(); break;
  case 'tfdest': {
   const i2=incById(TF.iid); TF.dest=d.h;
   if(TF.aviso){ TF.eo=etaOptions(i2,TF.dest,TF.depart); TF.etaCorrect=TF.eo.correct; TF.eta=null; TF.stage=2; }
   else { TF.eta=null; TF.etaCorrect=null; TF.stage=3; }
   renderModal(); break; }
  case 'tfeta': TF.eta=TF.eo.opts[+d.k].t; TF.stage=3; renderModal(); break;
  case 'tfback': TF.stage=(TF.stage===3&&!TF.aviso)?1:TF.stage-1; renderModal(); break;
  case 'tfref': TF.refOpen=!TF.refOpen; break;
  case 'tfgo': confirmTransport(); closeModal(); TF=null; renderSheet(true); renderAll(); break;
  case 'tfcancel': closeModal(); TF=null; break;
  /* Modal */
  case 'mclose': closeModal(); setTimeout(runQueue,0); renderAll(); break;
  case 'mbtn': { const b=M.btns[+d.i]; closeModal(); if(b&&b.fn) b.fn(); setTimeout(runQueue,0); break; }
  case 'info': openModal('info',{k:d.k}); break;
  case 'hio': startHio(M.rep); break;
  case 'hioans': hioAnswer(+d.k); break;
  case 'winCont': closeModal(); G.endShown=false; break;
  case 'restartNow': startNew(G.diff); break;
  /* Fuhrpark */
  case 'auto': autoAssign(); break;
  case 'pick': { const v=vehById(d.v); if(!canSwap(v)){ toast('Besatzungswechsel nur auf der Wache möglich.','warn'); break; } openModal('picker',{v:d.v,i:+d.i}); break; }
  case 'locked': toast('Besatzungswechsel nur auf der Wache möglich (Fahrzeug muss bereit stehen).','warn'); break;
  case 'pset': { const v=vehById(M.v), i=M.i; closeModal(); askAssign(v,d.n,i); setTimeout(runQueue,0); break; }
  case 'punset': { const v=vehById(M.v), i=M.i; const n=v.crew[i]; closeModal(); if(n){ unassign(n); renderAll(); } break; }
  case 'andi': andiGive(d.v); renderAll(); break;
  case 'andiopen': openModal('andi',{reply:null,opts:andiAskOpts(),view:'main'}); break;
  case 'andistash': M.view='stash'; renderModal(); break;
  case 'andiback': M.view='main'; M.game=null; renderModal(); break;
  case 'stashgo': {
   const lock=stashStealOK(); if(lock){ toast(lock,'warn'); break; }
   const w=stashZoneW();
   M.game={idx:+d.i,pins:0,strikes:0,w,left:rnd(8,92-w),pos:0,dir:1,spd:115,msg:'Ruhig bleiben…',msgcls:'',t0:performance.now()};
   M.view='game'; renderModal(); stashLoop(); break; }
  case 'stashhit': {
   const g=M.game; if(!g) break;
   const hit=g.pos>=g.left&&g.pos<=g.left+g.w;
   if(hit){ g.pins++; g.spd+=30; g.w=Math.max(6,g.w-3); g.msg='Klick! Ein Stift sitzt.'; g.msgcls='ok'; sfx('ok'); }
   else { g.strikes++; g.msg='Klirr! Das war laut…'; g.msgcls='bad'; sfx('bad'); }
   if(g.pins>=3){ const id=stashSuccess(g.idx); M.view='res'; M.res={ok:true,id}; M.game=null; }
   else if(g.strikes>=2){ stashCaught(); M.view='res'; M.res={ok:false}; M.game=null; }
   else g.left=rnd(6,94-g.w);
   renderModal(); renderAll(); break; }
  case 'stashnext': M.view=M.res&&M.res.ok?'stash':'main'; M.res=null; renderModal(); renderAll(); break;
  case 'bagtake': openModal('drugpick',{id:d.id,free:true}); break;
  case 'andiask': { if(!M||M.type!=='andi'||M.reply) break; const o=M.opts.find(x=>x.k===d.k); const r=andiAsk(d.k); r.said=o&&o.t; M.reply=r; renderModal(); renderAll(); break; }
  /* Shop */
  case 'shoptab': SHOP=d.k; renderShop(true); break;
  case 'buyfood': {
   const it=BILLA.find(x=>x.id===d.id);
   if(G.maut<it.p){ toast(`Zu wenig Maut für ${it.n}.`,'warn'); break; }
   openModal('drugpick',{id:d.id,food:true}); break; }
  case 'buydrug': {
   const dr=DRUGS.find(x=>x.id===d.id);
   if(G.maut<dr.p){ toast(`Zu wenig Maut für ${dr.n}.`,'warn'); break; }
   openModal('drugpick',{id:d.id}); break; }
  case 'drugwho': { const id=M.id, isFood=M.food, isFree=M.free; closeModal(); if(isFood){ buyFood(id,d.n); renderAll(); break; } const dr=DRUGS.find(x=>x.id===id);
   const doit=()=>{ buyDrug(id,d.n,isFree); renderAll(); };
   if(dr.od>0) confirmModal(`${dr.ic} ${dr.n} an ${d.n}?`,`Überdosis-Risiko ${Math.round(dr.od*100)} %. Bei einer Überdosis stirbt ${esc(d.n)}, und das Fahrzeug ist nicht mehr einsatzbereit.`,[{t:'Trotzdem nehmen',cls:'danger',fn:doit},{t:'Lieber nicht'}]);
   else doit();
   break; }
  case 'nefdisp': { const i2=incById(+d.id); if(!i2) break; openSheet(i2.id); onAction('disp',{dataset:{v:d.v}}); break; }
  case 'dolm': { const v=vehById(d.v); if(v.st==='idle'){ v.dolm=!v.dolm; renderAll(); } break; }
  /* System */
  case 'introimport': { const t=($('#introCode')||{}).value||''; if(importSave(t.trim())){ afterLoad(); toast('Spielstand importiert.','info'); } else toast('Der Code ist ungültig.','warn'); break; }
  case 'introload': if(loadSlot(d.id)){ afterLoad(); toast(`„${G.slotName}“ geladen.`,'info'); } else toast('Laden fehlgeschlagen.','warn'); break;
  case 'slotnew': { const r=saveToSlot(null); toast(r.ok?`Gespeichert als „${r.slot.name}“.`:(r.why==='full'?`Maximal ${MAX_SLOTS} Spielstände. Lösche einen alten.`:'Speichern nicht möglich – nutze den Export-Code.'),r.ok?'info':'warn'); renderSys(); break; }
  case 'slotsave': { const r=saveToSlot(d.id); toast(r.ok?`„${r.slot.name}“ überschrieben.`:'Speichern nicht möglich.',r.ok?'info':'warn'); renderSys(); break; }
  case 'slotload': { const s=readSlots().find(x=>x.id===d.id); if(!s) break;
   confirmModal('Spielstand laden',`„${esc(s.name)}“ laden? Nicht gespeicherter Fortschritt des aktuellen Spiels geht verloren.`,[{t:'Laden',cls:'go',fn:()=>{ if(loadSlot(d.id)){ afterLoad(); toast(`„${G.slotName}“ geladen.`,'info'); } else toast('Laden fehlgeschlagen.','warn'); }},{t:'Abbrechen'}]); break; }
  case 'slotdel': { const s=readSlots().find(x=>x.id===d.id); if(!s) break;
   confirmModal('Spielstand löschen',`„${esc(s.name)}“ endgültig löschen?`,[{t:'Löschen',cls:'danger',fn:()=>{ deleteSlot(d.id); renderSys(); }},{t:'Abbrechen'}]); break; }
  case 'restart': confirmModal('Neustart','Der aktuelle Fortschritt geht verloren. Wirklich neu beginnen?',[{t:'Ja, neu starten',cls:'danger',fn:()=>startNew(G.diff)},{t:'Abbrechen'}]); break;
  case 'diff': G.diff=d.k; renderSys(); toast(`Schwierigkeit: ${DIFFS[d.k].name}`,'info'); break;
  case 'export': $('#saveText').value=exportSave(); $('#saveText').select(); break;
  case 'import': if(importSave($('#saveText').value.trim())){ afterLoad(); toast('Spielstand importiert.','info'); } else toast('Der Code ist ungültig.','warn'); break;
 }
}

function init(){
 buildMap(); initMapInput();
 document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.closest('#map')&&MAP.dragged) return;
  ensureAudio();
  onAction(el.dataset.a,el);
 });
 document.addEventListener('change',e=>{
  if(e.target.id==='soundChk') SOUND=e.target.checked;
  if(e.target.classList&&e.target.classList.contains('slotname')){
   const ok=renameSlot(e.target.dataset.id,e.target.value);
   toast(ok?'Spielstand umbenannt.':'Name darf nicht leer sein.',ok?'info':'warn'); if(e.target.blur) e.target.blur(); renderSys(true);
  }
 });
 $('#speed').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!G) return; const s=b.dataset.s;
  if(s==='p') PAUSED=!PAUSED; else { PAUSED=false; SPEED=+s; }
  sfx('tap'); renderHeader();
 });
 /* Intro */
 let introDiff='mittel';
 const dseg=$('#introDiff');
 dseg.innerHTML=['leicht','mittel','schwer'].map(k=>`<button data-k="${k}" class="${k===introDiff?'on':''}">${DIFFS[k].name}</button>`).join('');
 dseg.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; introDiff=b.dataset.k; $$('#introDiff button').forEach(x=>x.classList.toggle('on',x===b)); });
 $('#btnStart').onclick=()=>{ ensureAudio(); sfx('go'); startNew(introDiff); };
 const lb=$('#btnLoadIntro'); lb.hidden=false;
 lb.onclick=()=>{
  const box=$('#introSlots'); box.hidden=!box.hidden;
  if(!box.hidden){
   const arr=readSlots().slice().sort((x,y)=>y.ts-x.ts);
   box.innerHTML=arr.length?arr.map(s=>`<button class="islot" data-a="introload" data-id="${esc(s.id)}">
    <span class="in">${esc(s.name)}</span>
    <span class="im">${fmtSlotTime(s.ts)} · ${esc((DIFFS[s.diff]||{}).name||'')} · ${Math.floor((s.t||0)/60)} h ${Math.floor((s.t||0)%60)} min</span>
    <span class="im">Nerven ${s.nerven} · 🪙 ${s.maut||0}</span><span class="ig">Laden ›</span></button>`).join(''):'<p class="muted" style="text-align:center">Keine Spielstände in diesem Browser gefunden. Spielstände gelten nur dort, wo sie gespeichert wurden (Seite oder heruntergeladene Datei). Du kannst unten einen Spielstand-Code einfügen.</p>';
   box.innerHTML+=`<details class="iimport"><summary>Spielstand-Code einfügen</summary><textarea id="introCode" rows="3" placeholder="Code aus System › Export einfügen"></textarea><button class="btn" data-a="introimport">Code laden</button></details>`;
  }
 };
 requestAnimationFrame(frame);
}

let lastT=performance.now(), acc=0;
function frame(now){
 const dt=Math.min(.25,(now-lastT)/1000); lastT=now;
 if(G){
  tickGame(dt);
  renderHeader();
  updateVehicles();
  if(SH.id!==null){ const inc=incById(SH.id); if(inc) updateTimer(inc); }
  acc+=dt;
  if(acc>=.25){
   acc=0;
   renderAll(); drawMarkers(false);
   if(SH.id!==null) renderSheet(false);
  }
 }
 requestAnimationFrame(frame);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();

window.__SIM={
 get G(){ return G; }, get M(){ return M; },
 newGame:startNew, spawn:spawnIncident, dispatch, answer, nextStep, openSheet, closeSheet, setTab, tickGame,
 autoAssign, onAction, doDeadClose, settle, needAviso, destOK, confirmTransport, openTransportFlow, doBelassen,
 get TF(){ return TF; }, etaOptions, hospSorted,
 setSpeed(s){ SPEED=s; }, closeModal
};

</script>
